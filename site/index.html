 "P2-3":{tr:"„Anlagen anlegen“ am Auftrag in Salesforce.",d:[["Salesforce → AP plus","Leere Anlagen (Hüllen) mit Bezeichnung, Eigentümer und Betreiber."],["AP plus → Salesforce","Anlagennummern zurück, die Anlagen hängen am Auftrag."]],h:["2.0"],ob:["Order","Anlage__c"],mo:["Welche Felder braucht die Hülle in AP plus (Status, Mietkonfiguration je Anlage, Disposition, Warenausgang)?","Verknüpfung Auftrag ↔ Anlage im bestehenden Anlagen-Objekt umsetzen (Wondercode)."]},
 "P2-5":{tr:"Der Technische Support gibt den Auftrag aus „Wird überprüft“ frei. Die Auftragsart bestimmt das Ziel: Kauf und Miete → AP plus, Partneraufträge → Monday, IHV → Wartungsvertrag, Miete zurück → Rücksendung. Die Freigabe ersetzt die heutige Aufgabe als Auslöser.",h:["0.1","0.2","1.0"],mo:["Welcher Status oder welches Feld am Auftrag bedeutet „freigegeben“?","Liste der 13 Auftragsarten mit Zielsystem bestätigen."]},
 "P2-6":{tr:"Ein Kauf- oder Mietauftrag ist freigegeben.",d:[["Salesforce → AP plus","Auftrag mit Positionen je Anlage, bei Miete je Anlage die Position „Mietkonfiguration“. Die Lieferadresse wird korrekt übertragen. Nur Auftragsarten mit Produktion."],["AP plus → Salesforce","AP-Auftragsnummer an den Auftrag (Order.AP_Auftrags_ID__c)."]],h:["1.1","1.2","1.3","1.4"],mo:["Lieferadresse korrekt übertragen, heute fehlerhaft (Wondercode)."]},
 "P2-8":{tr:"Eine Anlage oder ein Gerät wird in AP plus angelegt, geändert, zugeordnet oder ausgebucht.",d:[["AP plus → Salesforce","Anlagen (nur Anzeige) und Geräte. Schlüssel für Geräte ist Artikelnummer + Seriennummer (AP-ID). Salesforce ändert keine bestehenden Anlagen."]],h:["2.1","2.2","2.3","2.5"],mo:["AP-ID ins Salesforce-Layout (Wondercode).","Wie werden Mietprodukte ohne Seriennummer geführt?"]},
 "P2-9":{tr:"Anlagen, Seriennummern oder Artikel sind in AP plus neu oder ändern sich.",d:[["AP plus → MyMOBS","Anlagen in „Poolanlagen“, Seriennummern in „Poolgeräte“, dazu die Artikel. Die Pool-Tabellen liegen getrennt von MyMOBS Live. Läuft weiter wie heute."]],h:["2.4"],mo:["Klären, ob der Job auch Änderungen (verschobene Geräte) aktualisiert (Christian Sill)."]},
 "P2-12":{tr:"Die Logistik bucht den Warenausgang in AP plus.",h:["3.0"]},
 "P2-13":{tr:"Der Warenausgang ist in AP plus gebucht.",d:[["AP plus → Salesforce","Auftragsstatus „geliefert“. Das Order Management setzt ihn nicht mehr von Hand."],["In Salesforce","„geliefert“ löst die Rechnung in JustOn aus."]],h:["3.1","3.2"],mo:["Darf „geliefert“ die Rechnung automatisch auslösen?"]},
 "P2-14":{tr:"Ein Mietauftrag ist geliefert.",d:[["In Salesforce","Vertrag über die vereinbarte Mietzeit. Ist danach nicht alles zurück, entsteht jeden Monat ein neuer Vertrag für einen Monat. Die Anlagen hängen am Auftrag und an der Miete, nicht an einem einzelnen Vertrag."]],h:["4.0"],mo:["Datenmodell Auftrag–Anlage–Miete (Vorschlag Technik: erste Opportunity als Mietschlüssel).","Vertrag automatisch erstellen und aktivieren oder wie heute von Hand?"]},
 "P3-2":{tr:"Am Partnerauftrag in Salesforce wird per Button der Partner gewählt. Der Partner ist in Salesforce heute nicht hinterlegt.",h:["0.0"]},
 "P3-3":{tr:"Partnerwahl per Button am Auftrag.",d:[["Salesforce → Monday","Aufgabe im Board des Partners, in der Gruppe der Auftragsart. Die Auftragsnummer ist der Schlüssel; alles andere darf der Partner ändern."],["In Salesforce","Die Monday-Aufgabe ist am Auftrag verlinkt."]],h:["0.0"],ht:[["thor","THOR","Die Monday-Anbindung existiert im THOR-Code, ist aber deaktiviert."]],mo:["Mapping Partner → Monday-Board und Auftragsart → Gruppe: Wer liefert es, und wo wird es gepflegt?","Testboards und Admin-Token bereitstellen (C.M. Heim)."]},
 "P3-5":{tr:"Am Serviceauftrag wird per Button „Bestellvorschlag an Partner“ der Partner gewählt.",ht:[["oth","Monday","Der Service schreibt in Monday eine Nachricht an die Buchhaltung, die die Bestellung von Hand in AP plus anlegt."]]},
 "P3-6":{tr:"Button „Bestellvorschlag an Partner“ am Serviceauftrag.",d:[["Salesforce → AP plus","Bestellvorschlag im Einkauf mit den Positionen Arbeitszeit Servicetechniker (Stunden) und Anfahrt (km)."]],ht:[["oth","Monday","Der Service schreibt in Monday eine Nachricht an die Buchhaltung, die die Bestellung von Hand in AP plus anlegt."]],mo:["Partner als Lieferant in AP plus bestätigen.","Je Serviceauftrag eine Bestellung?"]},
 "P3-9":{tr:"Nicht entschieden.",d:[["Monday → Salesforce","Mindestens der Status, über die Auftrags- bzw. WV-Nummer als Schlüssel. Monday stösst dabei keine weiteren Abläufe an."]],mo:["Soll der Status aus Monday nach Salesforce kommen?","Prüfen, ob Monday eine eindeutige ID liefert (Wondercode)."]},
 "P4-2":{tr:"Ist der IHV-Auftrag geliefert, setzt der Innendienst ihn auf „geliefert“ und aktiviert den Vertrag. Der Abgleich mit AP plus entfällt.",h:["0.0","0.1"]},
 "P4-3":{tr:"Der Wartungsvertrag wird in Salesforce angelegt, aktiviert oder geändert.",d:[["Salesforce → MyMOBS","Servicelevel und Partner an den Kunden (MyMOBS-Felder „servicelevel“ und „kunden_id_partner“). Der Vertrag selbst bleibt nur in Salesforce."]],h:["0.3"],mo:["Feldzuordnung Wartungsvertrag → MyMOBS-Kunde festlegen (Wondercode).","Den Partner gibt es am Wartungsvertrag in Salesforce heute nicht, er kommt aus AP plus."]},
 "P4-4":{tr:"Button „Aufgabe an Monday“ am Wartungsvertrag. Abgefragt werden Art (Inspektion oder Wartung), Quartal und Partner.",h:["1.0"]},
 "P4-5":{tr:"Button „Aufgabe an Monday“ am Wartungsvertrag.",d:[["Salesforce → Monday","Aufgabe mit Projektname, WV-Nummer, Art und Quartal im Board des Partners."],["In Salesforce","Die Aufgabe ist am Wartungsvertrag verlinkt."]],h:["1.0"],ob:["MaintenanceOrder__c"],mo:["Der Button muss in Salesforce noch entwickelt werden (Wondercode).","Alle fälligen Verträge eines Quartals auf einmal anlegen?"]},
 "P4-6":{tr:"Im selben Schritt wie die Übergabe an Monday.",d:[["Salesforce → AP plus","Warenausgang mit Positionen und Lieferadresse: Batterien und Akkus, Menge = Anzahl Melder im Vertrag × 2, anpassbar."]],h:["1.1"],ob:["MaintenanceOrder__c"],mo:["Voraussetzung: Der Wartungsvertrag kennt seine Anlagen, sonst ist die Menge nicht berechenbar."]},
 "P4-8":{tr:"Button „Bestellvorschlag an Partner“ am Serviceauftrag.",d:[["Salesforce → AP plus","Bestellvorschlag im Einkauf mit den Positionen Arbeitszeit Servicetechniker (Stunden) und Anfahrt (km)."]],ht:[["oth","Monday","Der Service schreibt in Monday eine Nachricht an die Buchhaltung, die die Bestellung von Hand in AP plus anlegt."]],mo:["Partner als Lieferant in AP plus bestätigen.","Je Serviceauftrag eine Bestellung?"]},
 "P5-2":{tr:"Inside Sales legt im Vertrag einen Auftrag „Miete zurück“ an und wählt die Anlagen oder Teile, die zurückkommen.",h:["0.0"],mo:["Neue Auftragsart „Miete zurück“ einführen? Heute gibt es sie in Salesforce nicht."]},
 "P5-3":{tr:"Auftrag „Miete zurück“ im Vertrag.",d:[["Salesforce → AP plus","Rücksendung mit Kunde, Vertrag und je Anlage Artikel und Menge, ohne Seriennummern."],["AP plus → Salesforce","RMA-Nummer."]],h:["0.1","0.2"],mo:["Voraussetzung: Der Vertrag kennt Auftrag und Anlagen (SF 16)."]},
 "P5-4":{tr:"Die Ware kommt an.",h:["0.3"]},
 "P5-5":{tr:"Die Rücksendung ist in AP plus mit Seriennummern gebucht.",d:[["AP plus → Salesforce","Gebuchte Mengen, Seriennummern und Status. Die Anlagen sind ausgebucht, fehlende Teile sind sichtbar."]],h:["0.4"]},
 "P5-6":{tr:"AP plus meldet, welche Anlagen, Mengen und Seriennummern zurück sind.",d:[["In Salesforce","Soll/Ist-Vergleich mit der erwarteten Menge. Die nächste Monatsverlängerung entsteht mit der Restmenge; sind alle Anlagen zurück, endet die Miete. Inside Sales erhält die Aufgabe „Vertrag prüfen“."]],h:["1.0","1.1","1.2"],mo:["Umsetzung über Rücksendezeilen und die Verlängerungsmenge in CPQ (Wondercode)."]},
 "P6-2":{tr:"Das Callcenter oder der Kunde füllt in MyMOBS eine Supportanfrage aus. Ruft der Kunde an, legt der Technische Support den Kundenvorgang von Hand an.",d:[["MyMOBS → Salesforce","Kundenvorgang über eine direkte Schnittstelle (Web2Case), nicht über THOR. Kein Handlungsbedarf für den THOR-Nachfolger."]],h:["0.0"]},
 "P6-3":{tr:"Der Service legt im Kundenvorgang die RMA an und wählt das Gerät über die AP-ID (Artikel + Seriennummer).",h:["0.1"]},
 "P6-4":{tr:"RMA im Kundenvorgang.",d:[["Salesforce → AP plus","Rücksendung mit Seriennummer."]],h:["0.2"]},
 "P6-6":{tr:"AP plus bucht die Rücksendung.",d:[["AP plus → Salesforce","Status. Der Service erhält die Aufgabe „Rücksendung gebucht“. Der Vertrag bleibt unverändert."]],h:["0.3","0.4"]},
 "P7-2":{tr:"Das Kontaktformular auf der Website wird abgeschickt.",d:[["Website → Salesforce","Lead (MOBS oder FEBS) per Webhook. Läuft heute so und bleibt so."]]},
 "P7-3":{tr:"Der Vertrieb legt die FEBS-Opportunity in Salesforce an, wie bisher bei Streit.",d:[["Salesforce → KWP","Nichts. Lead und Opportunity bleiben in Salesforce, keine Vermischung (FEBS-Wunsch). Die Verbindung zu KWP entsteht über das KWP-Angebot an der Opportunity."]],mo:["Ist die Lead-Herkunft für die Provision über den Opportunity-Owner in Ordnung (FEBS)?"]},
 "P7-5":{tr:"FEBS legt in KWP einen Kunden oder Ansprechpartner an.",d:[["KWP → Data Warehouse","Kunde und Kontakt: Anrede, Name, Vorname, Adresse, Telefon, USt-ID, Debitorennummer, Zahlungskonditionen. Zugriff über die KWP-Datenbank (gleicher Server wie AP plus)."],["Data Warehouse → Salesforce","Abgleich mit den bestehenden Kunden; fehlende Accounts anlegen, keine Dubletten. Noch nicht bestätigt."]],mo:["Feldliste und Beispieldatensätze senden (FEBS), Zugang zur KWP-Datenbank (IT).","Widerspruch zu KWP 4: Account in Salesforce anlegen oder keine Integration?"]},
 "P7-7":{tr:"Angebot, Auftrag oder Rechnung entsteht in KWP.",d:[["KWP → Salesforce","Lesend an die Opportunity: KWP-Angebotsnummer, Positionen als Text, Betrag."]],mo:["Wie wird das KWP-Angebot mit der Opportunity verknüpft?","Was gilt bei einem KWP-Angebot ohne Opportunity?"]}

const SOLL_EN={"SF 1": {"t": "New customer to ERP", "f": "Salesforce (master data); AP plus assigns the customer number", "o": "Wondercode: delivery address mapping.\nC.M. Heim: Should address changes after initial creation also go to AP plus?", "ts": "", "s": "If the opportunity is 'Closed Won' and the account does not yet have an AP customer number, the integration creates the company, billing address, contacts and delivery address (as a separate address) in AP plus. The AP customer number comes back to the account.\nExisting customers are not created again; only the order goes to AP plus. The task 'Prospect soll AP Kunde werden' (prospect to become AP customer) is no longer the trigger.\nWithout a delivery address nothing is transferred.\nDelivery address validation in opportunity status Closed Won.", "q": ""}, "SF 2": {"t": "Customer to portal", "f": "Salesforce", "o": "Wondercode/Christian Sill: check whether suppliers end up in MyMOBS today, and exclude them.", "ts": "", "s": "If a MOBS account receives an AP customer number, the customer is created in MyMOBS. Only MOBS customers, no suppliers, no FEBS. Stays as today.\nConcerns the users, not the customer, see no. 7.\nOnly the company is created (customer record with operator password), no user yet. The first user (admin) is created by no. 7; without the company no user can be created.", "q": ""}, "SF 3": {"t": "Installations", "f": "AP plus (later device database)", "ts": "", "s": "If an installation is created, changed or booked out in AP plus, Salesforce shows the current state (display only), the MyMOBS device database is updated and the Data Warehouse keeps the history.\nSalesforce does not change existing installations. The only exception: creating empty installation shells (no. 11).\nInstallation data is maintained in AP plus only; Salesforce reads it. This avoids overwrites.\nSalesforce object: Anlage", "q": "", "o": "C.M. Heim: Where are 'last maintenance' and 'next maintenance' maintained? Proposal: on the maintenance contract in Salesforce (see Monday no. 3).\nC.M. Heim: Remove unused fields (Letzte_Wartung_SFC__c, Kaufdatum__c, Heim_Auftrag_Service__c and 9 device fields)?\nC.M. Heim: Is C.M. Heim the owner of the 1,450 installations in the rental fleet?"}, "SF 4": {"t": "Devices", "f": "AP plus", "o": "Wondercode: add AP ID to the Salesforce layout.\nC.M. Heim: How are rental products without a serial number handled?", "ts": "", "s": "If a device is entered in AP plus, assigned to an installation or separated from it (return), the current state is visible in Salesforce. The key is article number + serial number (AP ID). The device ↔ installation history is kept in the Data Warehouse.\nNo sync in both directions. Detector number changed on site: mitigated by transferring updates; only fully solvable with the device database.\nThe Salesforce architecture must be adapted, because the current architecture does not support this structure.", "q": ""}, "SF 5": {"t": "Device database", "f": "AP plus", "o": "", "s": "If installations, serial numbers or articles are new or change in AP plus, they are up to date in the MyMOBS pool tables (Poolanlagen, Poolgeräte) and in Salesforce, including moves and bookings out. Continues as today.", "q": "", "ts": ""}, "SF 6": {"t": "Maintenance contracts", "f": "Salesforce", "ts": "Sync of maintenance contracts with AP plus", "s": "Dropped: the sync of maintenance contracts from AP plus to Salesforce. Maintenance contracts (IHV) are created and maintained in Salesforce only, so the sync is no longer needed. The Data Warehouse reads the contracts from Salesforce.\nWhat continues: the maintenance contract itself (no. 20), service level and partner to MyMOBS (MyMOBS no. 3), the quarterly task to Monday (Monday no. 3).", "q": "", "o": "Service level and partner on the MyMOBS customer are still needed (confirmed 23.11.2026); transfer see MyMOBS no. 3."}, "SF 7": {"t": "Portal users", "f": "MyMOBS (users); Salesforce only triggers the first admin", "ts": "", "s": "Direction is Salesforce → MyMOBS (not the other way round).\n\n1. Using the MyMOBS connection information sheet (PDF), the customer reports the users to be created first. The sheet goes to Julian.\n2. Julian enters the contact in Salesforce in the account field “MyMOBS Admin”.\n3. The integration creates the contact as admin in MyMOBS and sends the credentials with password by email (Brevo).\n4. Further users are created by the customer's admin in MyMOBS.\n\nStays like this until MyMOBS V2. Julian uses the function regularly for Order Management.\n→ BPMN 02\nShould be solved via Account Teams, to have an overview of all admins.\nPrerequisite: the company already exists in MyMOBS (no. 2).", "q": "", "o": "Prerequisite: the admin has completed the training (Confluence). Entered by Julian.\nKnown weaknesses: admin role only; a replaced admin stays active (see MyMOBS 'Offboarding')."}, "SF 8": {"t": "Returns", "f": "Salesforce (trigger, expected quantity); AP plus (booking, serial numbers)", "ts": "", "s": "Goal: every return starts in Salesforce. AP plus books it; afterwards Salesforce knows the result. There are two cases.\n\nA) End of rental (full or partial)\n\n1. The customer announces the return.\n2. Inside Sales creates an order “Miete zurück” (rental return) from the contract and selects the installations or individual parts that are coming back.\n3. Salesforce creates the return in AP plus: customer, contract and, per installation, article and quantity, without serial numbers. The RMA number comes back to Salesforce.\n4. The goods arrive. Logistics checks them physically, scans the serial numbers and books them in AP plus.\n5. AP plus reports the booked quantities, serial numbers and status to Salesforce. The installations are booked out; missing parts are visible.\n6. Then “Adjust contract” follows (no. 17), for partial returns no. 18.\n\nB) Defect or maintenance at the plant (individual devices)\n\n1. The customer reports a defect; a customer case is created.\n2. Service creates the RMA from the customer case and selects the device via the AP ID (article + serial number). For maintenance at the plant it can be chosen whether the whole installation or individual devices come in (Heike's idea).\n3. Salesforce creates the return with serial number in AP plus.\n4. AP plus books it. Salesforce receives the status, Service gets the task “Rücksendung gebucht” (return booked) and creates an opportunity and quote (repair or new device).\n5. The contract stays unchanged.\n\nNo longer needed: empty headers from the opportunity, returns only in AP plus, and the delivery note by email.", "q": "", "o": "Prerequisite: the contract knows the order and installations (new row 'Link').\nHeike's idea (task for 'maintenance at the plant'): in case B allow choosing whether the whole installation or individual devices come in.\nPartial return: see new row.\nConfirm the change of role: today Order Management creates the RMA (Confluence). In the target, Inside Sales creates it from the contract (case A) and Service from the customer case (case B).\nUnannounced returns: not defined in the workshop or Confluence. Goal from the workshop: everything arrives at one place, is recorded and passed on.\nC.M. Heim: Does the internal Monday board 'Miete zurück' stay? Which value threshold applies to damage (Confluence: 'xy €')? Where is the SIM deactivated?\nC.M. Heim: Introduce a new order type “Miete zurück” (rental return)? It does not exist in Salesforce today."}, "SF 9": {"t": "Production order & rental order", "f": "Salesforce (order); AP plus (production)", "o": "Wondercode: transfer the delivery address correctly (incorrect today).\nDepends on no. 11.", "ts": "", "s": "Goal: Order Management works only in Salesforce. The order arrives in AP plus already split into installations; the manual split in AP plus is no longer needed.\n\n1. A purchase or rental order has been created (status “Wird überprüft”, under review).\n2. Order Management selects 'Create installations' on the order and enters the number, name, owner and operator. The integration immediately creates the installations as empty shells in AP plus. The installation numbers come back to the installations in Salesforce (details no. 11).\n3. Order Management assigns article and quantity to each installation in Salesforce, based on the MOBS calculator.\n4. Technical Support releases the order. This replaces today's task as the trigger.\n5. The integration creates the order with line items in AP plus. The line items are assigned to the installations; for rentals one “rental configuration” line is added per installation. The delivery address is transferred correctly.\n6. The AP order number comes back to the order in Salesforce.\n7. Production works in AP plus as usual and assigns the serial numbers to the installations. These come back to Salesforce (nos. 3 and 4).\n\nThe customer still sees quantities in the order confirmation. Only order types with production go to AP plus.", "q": ""}, "SF 10": {"t": "Goods issue for maintenance material", "f": "Salesforce (trigger, maintenance contract); AP plus (goods issue, stock)", "o": "C.M. Heim: approve the process; take the result of the internal initiative (Heike) into account.\nPrerequisite: the maintenance contract knows its installations (no. 16), otherwise the quantity cannot be calculated.", "s": "Goal: the goods issue for maintenance material is triggered from the maintenance contract in Salesforce, not from Monday.\n\n1. In the maintenance contract, the maintenance for the quarter is handed over to Monday (Monday no. 3).\n2. In the same step the goods issue for batteries and rechargeable batteries is triggered. Quantity = number of detectors in the contract x 2, adjustable.\n3. The integration creates the goods issue with line items and delivery address in AP plus.\n4. Logistics ships from AP plus; stock is correct.\n\nThe maintenance contract only contains the quarter; you agree the actual date with the partner in Monday.", "q": "", "ts": ""}, "SF 11": {"t": "Create installations", "f": "Salesforce (planning of installations); AP plus (installation number, serial numbers, actual state)", "o": "C.M. Heim: Will this solution be built as an interim solution until the device database exists? (left open in the workshop)\nC.M. Heim: Which fields does the shell need in AP plus (status, rental configuration per installation, scheduling, goods issue)?\nWondercode: implement the order ↔ installation link in the existing installation object (see no. 16).", "s": "Goal: Order Management splits an order into installations in Salesforce and no longer needs an AP plus licence for this.\n\nExample: 32 detectors are sold. According to the planning team's MOBS calculator these are 4 installations with 8 detectors each.\n\n1. Before the purchase or rental order is released for production, Order Management selects 'Create installations' on the order in Salesforce and enters the number of installations (4 in the example), plus name, owner and operator.\n2. The integration creates the same number of empty installations (shells) in AP plus. The installation numbers come back to Salesforce; the installations are linked to the order.\n3. In Salesforce, Order Management assigns article and quantity to each installation, e.g. installation 1: 8 detectors article X, 1 control panel article Y. The basis is the MOBS calculator; there is no automatic split rule.\n4. On production release, the order goes to AP plus with the line items per installation (no. 9).\n5. Production assigns the serial numbers to the installations in AP plus as usual. These come back to Salesforce (no. 3, 4).\n\nIn the quote and order confirmation the customer still sees quantities (32 detectors), not the split.\nSalesforce only creates the shells and does not change existing installations afterwards (no. 3).", "q": "", "ts": ""}, "SF 12": {"t": "Customer case: send replacement detector", "f": "Salesforce (customer case, order); AP plus (production, shipping, RMA)", "o": "C.M. Heim: hand the new replacement process over to Wondercode.", "s": "Deferred: C.M. Heim is redesigning the replacement process internally from December and will then hand it to Wondercode.\n\nToday: customer case → opportunity/quote for replacement device → AP order → shipping → RMA for defective device → quote/order for repair → delivery → second RMA for the replacement device. One person in 3–4 systems; costs higher than revenue.\n\nProbably the only part relevant for the integration: the order goes from Salesforce to AP plus (like purchase/rental).\nA request directly in MyMOBS is out of scope (no further development in MyMOBS, see MyMOBS no. 7).\nToday the trigger is the customer case in Salesforce (call to Technical Support).", "q": "", "ts": ""}, "SF 13": {"t": "NSL contract data from PST", "f": "AP plus (incoming invoice); Salesforce (recharging)", "o": "C.M. Heim: confirm the rule. Workshop: Accounting, per call; Confluence: Purchasing, from 5 alarms.\nC.M. Heim: send a sample PST invoice.", "s": "If the monthly PST invoice (PDF) shows alarms for a customer, they are recharged: according to Confluence by Purchasing from 5 alarms (new quote group, customer case, adjust order, invoice).\nNo automation planned, because the source is a PDF.", "q": "", "ts": ""}, "SF 14": {"t": "Lead from website", "f": "Salesforce", "o": "", "s": "If the contact form on the website is submitted, the lead (MOBS or FEBS) is in Salesforce. Runs via webhook today and stays as is.", "q": "", "ts": ""}, "SF 15": {"t": "Order type determines the target", "f": "Salesforce (order, order type)", "s": "If an order with status 'Wird überprüft' (under review) is released by Technical Support, the order type determines the target:\n- Purchase, rental (production) → AP plus\n- Installation, removal, commissioning, planning, aerial work platform, fault clearance, training → task to Monday (partner)\n- IHV, maintenance → maintenance contract in Salesforce\n- Rental return → return (no. 8)\n- NSL → no. 13", "q": "", "ts": "", "o": "C.M. Heim: confirm the list of 13 order types with target system (incl. replacement, service).\nC.M. Heim: define the release trigger: which status or field on the order means 'released'? The sources name no status between 'Wird überprüft' (under review) and 'geliefert' (delivered). Today a task to Technical Support triggers it; this task will be dropped.\nConflict with Monday no. 2: here the task goes to Monday automatically on release, there via a button with partner selection. Which applies?"}, "SF 16": {"t": "Link order, installation, contract", "f": "Salesforce (link); AP plus (installations, serial numbers)", "ts": "", "s": "Goal: in Salesforce the order, installations and rental are linked. For every rental you can see which installations and serial numbers are still at the customer.\n\nExample: a customer rents 100 detectors, split into 4 installations of 25. Today the contract only says \"100 detectors rental\". Nobody knows which installations and serial numbers belong to it without searching.\n\n1. Order Management creates the installations on the order (no. 11). Order and installations are thus linked.\n2. When a rental order is delivered, a contract is created for the agreed rental term. If not everything has been returned by then, a new one-month contract is created every month until everything is back. The installations therefore belong to the order and the rental, not to a single contract. Still at the customer: the installations of the order minus the booked returns.\n3. The serial numbers come from AP plus to the installations as today (nos. 3, 4).\n4. On the maintenance contract (IHV), the installations to be maintained are assigned.\n\nNeeded for: return from the contract (no. 8), adjusting the contract after a return, maintenance material (no. 10), the quarterly check list and the Data Warehouse (serial number ↔ contract).", "q": "", "o": "Wondercode: propose the order–installation–rental data model (technical proposal: first opportunity as rental key, installation ↔ order).\nC.M. Heim: Create and activate the contract automatically, or manually by Order Management as today?\nWondercode + C.M. Heim: Which automations are needed in Salesforce for the link order – installation – contract?\nC.M. Heim: Keep creating contracts from the opportunity and use the first opportunity as the rental key (technical proposal)?"}, "SF 17": {"t": "Adjust contract after return", "f": "Salesforce (contract)", "ts": "", "s": "Goal: after a rental return has been booked, the next monthly renewal is created automatically with the remaining quantity. Accounting no longer reconciles anything by hand.\n\nRule (decided on 25.11.2026):\n- Return during the agreed rental term: the contract stays unchanged until the end of the term. The return takes effect from the first monthly renewal.\n- Return during the monthly renewal: the current month stays unchanged. The return takes effect from the next monthly renewal.\n\nExample: a customer rents 100 detectors on 4 installations and sends back installation 2 (25 detectors). The current contract stays at 100 detectors; the next renewal contains 75.\n\n1. Logistics books the return in AP plus with serial numbers (no. 8).\n2. AP plus reports to Salesforce which installations, quantities and serial numbers are back.\n3. Salesforce compares with the expected quantity from the return (target/actual).\n4. The next monthly renewal is created with the remaining quantity. Once all installations are back, no further renewal is created and the rental ends.\n5. Inside Sales receives a task 'Check contract' with the target/actual comparison and confirms. If parts are missing (e.g. 28 instead of 30), this is visible and Inside Sales clarifies it with the customer.\n\nReturns without a contract (defect, repair) do not change the contract.\nNo longer needed: delivery note by email, manual reconciliation by Accounting.", "q": "", "o": "Wondercode: implement via return lines and the renewal quantity in CPQ (technical map B4, B16)."}, "SF 18": {"t": "Partial rental return", "f": "Salesforce", "ts": "", "s": "Goal: if the customer returns only part of the rented installations, the rental continues with the remaining quantity, and Salesforce always shows what is still at the customer.\n\nA) Planned partial return (the customer deliberately returns only a part, e.g. \"installation green\")\n1. The customer announces the return. Inside Sales clarifies with them which installations or parts are coming back.\n2. Inside Sales creates an order \"Miete zurück\" (rental return) from the contract and selects only these installations or parts (no. 8).\n3. Salesforce creates the return in AP plus: article and quantity per selected installation, without serial numbers.\n4. Logistics checks physically, scans the serial numbers and books in AP plus.\n5. AP plus reports the booked quantities and serial numbers to Salesforce. Salesforce compares with the expected quantity (target/actual, no. 17).\n6. The returned installations are booked out. The next monthly renewal contains only the remaining installations (rule see no. 17).\n7. Inside Sales receives the task \"Check contract\" and confirms.\n\nB) Unplanned shortfall (less comes back than announced, e.g. 28 instead of 30)\n1. Logistics books only the quantity that actually arrived.\n2. The target/actual comparison shows the shortfall. What did not arrive stays in the rental.\n3. Inside Sales clarifies the missing parts with the customer.\n\nNo longer needed: delivery note by email and reconciliation by Accounting.\nPrerequisite: the rental knows its installations (no. 16).\n→ BPMN 09", "q": "Workshop part 1, approx. 01:18–01:30 and 02:55–02:58; Confluence \"Miete zurück\" (describes only full returns)", "o": "C.M. Heim: Shortfall – create a new RMA for the rest as today, or is the target/actual comparison with a task for Inside Sales enough?"}, "SF 19": {"t": "Invoices into the Data Warehouse (JustOn)", "f": "JustOn (Salesforce)", "o": "C.M. Heim: Should JustOn and Datev become sources of the Data Warehouse?", "s": "If an invoice, payment or dunning notice is created in JustOn, MOBS invoices, payments and open items are in the Data Warehouse.\nThe invoice is triggered by the status 'geliefert' (delivered) on the order. The weekly transfer JustOn → Datev (tax accountant) stays as today.\nNot discussed in the workshop; from Confluence.", "q": "", "ts": ""}, "AP 1": {"t": "New customer to ERP", "f": "Salesforce (master data); AP plus (customer number)", "o": "", "s": "See Salesforce no. 1. If the opportunity is 'Closed Won' and the customer does not yet have an AP customer number, the customer is created in AP plus with the delivery address as a separate address. AP plus assigns the customer number.\n→ BPMN 01", "q": "workshop part 1, approx. 14:05–20:30 and 02:52:58", "ts": ""}, "AP 2": {"t": "Installations", "f": "AP plus", "o": "See Salesforce no. 3 and 11.", "s": "If an installation is created, changed or booked out in AP plus, Salesforce shows the current state. Direction AP plus → Salesforce (not the other way round).\nThe only direction Salesforce → AP plus: creating empty installation shells (Salesforce no. 11), no changes to existing installations.\n→ BPMN 05", "q": "workshop part 1, approx. 25:00–39:00 and 02:52:58; part 2, approx. 03:20–04:10", "ts": ""}, "AP 3": {"t": "Devices", "f": "AP plus", "o": "", "s": "See Salesforce no. 4. If a device is entered, assigned or separated in AP plus, the current state is visible in Salesforce. Key: article number + serial number (AP ID).\n→ BPMN 05", "q": "workshop part 1, approx. 25:00–39:00 and 01:50:46", "ts": ""}, "AP 4": {"t": "Device database", "f": "AP plus", "o": "", "s": "See Salesforce no. 5. Installations, serial numbers and articles go to MyMOBS (pool tables) and Salesforce, including changes.\n→ BPMN 05", "q": "workshop part 3, approx. 13:00–20:40", "ts": ""}, "AP 5": {"t": "Maintenance contracts", "f": "Salesforce", "o": "", "s": "Maintenance contracts are now created and maintained in Salesforce only. The sync with AP plus is dropped.\n→ BPMN 07", "q": "workshop part 1, approx. 39:13 and 02:53:32", "ts": "Sync of maintenance contracts with AP plus"}, "AP 6": {"t": "Returns", "f": "Salesforce (trigger); AP plus (booking, serial numbers)", "o": "Prerequisite: link order–installation–contract (Salesforce, new row).", "s": "If a return is booked with serial numbers in AP plus, status, booked quantities and serial numbers are visible in Salesforce, the installations are booked out and the history is in the Data Warehouse. For defects, Service receives a task 'Rücksendung gebucht' (return booked).\nThe return is created in Salesforce (Salesforce no. 8). Your request in column N (from the contract at installation level) is exactly the target picture.\nThe delivery note by email to Invoice is then no longer needed.\n→ BPMN 09, 10", "q": "workshop part 1, approx. 01:21–01:52 and 02:55–02:58", "ts": ""}, "AP 7": {"t": "Production order", "f": "Salesforce (order); AP plus (production)", "o": "", "s": "See Salesforce no. 9. If a purchase or rental order is released, it is in AP plus with line items.\nAP plus no. 7 and Salesforce no. 9 are the same process. It also depends on Salesforce no. 11: if the installation shells come from Salesforce, the split in AP plus is no longer needed.\n→ BPMN 04", "q": "workshop part 1, approx. 01:00–01:16 and 02:53:32", "ts": ""}, "AP 8": {"t": "New article", "f": "AP plus (production articles); Salesforce (rental and service articles)", "o": "Viktor: Is there a rental flag or an article group in the view? Otherwise derive rental articles manually.\nWondercode: Is 'To be checked' sufficient?", "s": "If a production or spare part article is created in AP plus (with bill of materials), it exists in Salesforce with the field 'To be checked' and in the MyMOBS device database.\nRental articles (prefix 'M', for CPQ/subscriptions) are derived in Salesforce from the sales article. Service articles exist only in Salesforce.\nArticles in Salesforce = sales, rental and service articles for CPQ. Triggered from AP plus because that is where production articles are created.\n→ BPMN 03", "q": "workshop part 1, approx. 02:16–02:28; part 2, approx. 00:00–00:38", "ts": ""}, "AP 9": {"t": "Return of rental installations", "f": "Salesforce (trigger); AP plus (booking)", "o": "", "s": "Replaced by Salesforce no. 8: the return is not created on delivery, but when the customer announces the return, from the contract at installation level (article and quantity per installation, without serial numbers).\nAutomations within AP plus are not part of the project.\nIn the target picture, return line items are generated from the contract and installations.\n→ BPMN 09", "q": "workshop part 1, approx. 02:54:10–02:55:45", "ts": "Create return at delivery (replaced by SF 8)"}, "AP 10": {"t": "Service order", "f": "AP plus (booking)", "o": "Information to Salesforce: stays (see no. 6). Service order: out of scope.", "s": "If a return is booked, Salesforce receives the status and Service receives a task (runs today, stays).\nWork preparation continues to create the service order in AP plus manually: automation within AP plus is not part of the project.\nThe information is needed because Service continues the quote (repair/new device) in Salesforce from it.\n→ BPMN 10", "q": "workshop part 2, approx. 00:49; part 1, approx. 01:36–01:39", "ts": ""}, "AP 11": {"t": "Extract documents", "f": "AP plus", "o": "Wondercode: check the API.\nC.M. Heim: Which document types exactly?", "s": "If a document (PDF) is stored in AP plus, it is available in the Data Warehouse via the AP plus API (email of 21.10.2026).\nDocuments from SharePoint belong to phase 2 (AI via Langdock).\n→ Other sources", "q": "workshop part 2, approx. 00:59–02:31", "ts": ""}, "AP 12": {"t": "Production costs of a product", "f": "AP plus", "o": "C.M. Heim: define cut-off date, approval and calculation basis.\nWondercode: Is the INV price available in the views?", "s": "Once the annual unit cost (INV price) is released (e.g. in December for the following year), the unit costs are in the Data Warehouse and in the following year's price book in Salesforce (for margin and commission).\nA stable annual value instead of continuous adjustment. Today's estimates in Salesforce are no longer needed.\n→ BPMN 03", "q": "workshop part 1, approx. 02:29–02:34; part 2, approx. 02:41–03:13", "ts": ""}, "AP 13": {"t": "Delivery status to Salesforce", "f": "AP plus", "o": "C.M. Heim: approval. May 'geliefert' trigger the invoice automatically?", "s": "If the goods issue is booked in AP plus, the order in Salesforce is set to 'geliefert' (delivered). This triggers the invoice (JustOn).\nOrder Management no longer sets the status manually.\n→ BPMN 04", "q": "workshop part 1, approx. 01:15:32–01:16:08; Confluence 'Auftragabwicklung' (order processing)", "ts": ""}, "AP 14": {"t": "Access to AP plus", "f": "AP plus", "o": "Wondercode: request missing fields (rental flag, INV price, installation updates) from Viktor in one go.", "s": "The integration reads AP plus via the views (ANP_CMH_THOR_*) and writes only via the hand-over tables (_RW), as THOR does today. AP plus itself is not reconfigured.\n→ all", "q": "workshop part 2, approx. 04:16–04:36; THOR analysis", "ts": ""}, "KWP 1": {"t": "New customer ERP", "f": "KWP", "s": "Goal: all FEBS customers from KWP are in the Data Warehouse and merged there with the customers from Salesforce, AP plus and MyMOBS.\n\n1. FEBS creates the customer in the KWP address management (manually, as today).\n2. The integration reads the customer from the KWP database into the Data Warehouse. Access via the database as with AP plus (same server).\n3. The Data Warehouse matches it with existing customers and enriches them: one customer with AP customer number, Salesforce ID and KWP number.\n4. If the account does not yet exist in Salesforce, it is created there (no duplicates).\n\nFields according to the workshop: salutation, last name, first name, address, phone, VAT ID, debtor number, payment terms. Time recording and employees are not relevant.\nKWP goes live on 01.01.2027; until then Streit runs in parallel.\n→ BPMN 12", "q": "workshop part 3, approx. 38:00–59:00 and 02:11–02:18", "ts": "", "o": "C.M. Heim (FEBS): send sample records or screenshots and a field list.\nC.M. Heim (IT): access to the KWP database.\nC.M. Heim: confirm step 4 (mentioned as a proposal in the discussion with Mark).\nConflict with no. 4: there it says 'accounts and contacts without integration' (discussion with Mark). Step 4 here creates missing accounts in Salesforce. Which applies?"}, "KWP 2": {"t": "Contact to ERP", "f": "KWP", "o": "", "s": "If a contact is created in KWP, it is in the Data Warehouse and matched with existing contacts (as no. 1).\n→ BPMN 12", "q": "workshop part 3, approx. 42:00–43:00 (address management); customer questionnaire KWP no. 2", "ts": ""}, "KWP 3": {"t": "Revenue into the Data Warehouse", "f": "KWP", "o": "C.M. Heim (FEBS): name the relevant fields.", "s": "Goal: revenue reporting for the Heim group runs via the Data Warehouse. Mark gets access; Wondercode builds the dashboard on top.\n\n1. FEBS writes invoices in KWP.\n2. Revenue, open items and balances per customer go to the Data Warehouse.\n3. Likewise projects, quotes, orders and maintenance orders. Take everything broadly first, then decide together how deep to go into the projects.\n→ BPMN 12", "q": "workshop part 3, approx. 45:20–46:50, 54:30–59:00 and 01:00:00", "ts": ""}, "KWP 4": {"t": "Lead from SF to KWP", "f": "Salesforce (lead, opportunity); KWP (project)", "s": "Leads are not transferred from Salesforce to KWP (FEBS request, no mixing; accounts and contacts without integration, confirmed in the discussion with Mark).\nLead and opportunity stay in Salesforce. The link to KWP is made via the KWP quote on the opportunity (KWP no. 5).\nThe lead origin for commission is derived from the opportunity owner.", "q": "workshop part 3, approx. 43:00–50:40 and 02:05–02:18", "ts": "No lead transfer to KWP", "o": "C.M. Heim (FEBS): Is deriving the lead origin for commission from the opportunity owner acceptable?\nConflict with no. 1, step 4 (create account in Salesforce). Which applies?"}, "KWP 5": {"t": "FEBS quotes on the opportunity", "f": "KWP (quote, order, invoice); Salesforce (opportunity)", "o": "Wondercode + FEBS: How is the KWP quote linked to the opportunity (reference in KWP)?\nWhat happens with a KWP quote without an opportunity?", "s": "Goal: the entire pipeline of the Heim group is visible in Salesforce (MOBS and FEBS). KWP remains leading for FEBS quotes, orders and invoices.\n\n1. Sales creates the FEBS opportunity in Salesforce (as previously with Streit).\n2. FEBS creates quote, order and invoice only in KWP (own number ranges).\n3. Quote, order and invoice are mirrored read-only to Salesforce and linked to the opportunity (KWP quote number, line items as text, amount).\n4. The opportunity is closed once the invoice has been written in KWP.\n\nThe FEBS structure in Salesforce (own objects, FEBS app) already exists.\n→ BPMN 12", "q": "workshop part 3, approx. 02:05–02:17 (with Mark)", "ts": ""}, "KWP 6": {"t": "KWP articles in CPQ", "f": "KWP", "o": "C.M. Heim: Are KWP articles needed in CPQ, or is mirroring the KWP quotes (no. 5) sufficient?", "s": "FEBS view: FEBS quotes are created only in KWP.\nKWP quotes are mirrored to the opportunity (no. 5); the articles appear there only as text or line item.\nFor FEBS quotes, mirroring as text and amount is sufficient (no. 5); no KWP articles are synchronised to Salesforce.\n→ BPMN 03", "q": "workshop part 1, approx. 02:20; part 3, approx. 01:05–01:06 and 02:09–02:10", "ts": ""}, "MM 1": {"t": "Customer to portal", "f": "Salesforce", "o": "Wondercode/Christian Sill: check whether suppliers end up in MyMOBS.", "s": "See Salesforce no. 2. If a MOBS account in Salesforce receives an AP customer number, the customer is created in MyMOBS. Stays as is.\nSuppliers do not exist in Salesforce; still check whether any arrive in MyMOBS.\n→ BPMN 01", "q": "workshop part 3, approx. 01:36–09:10; part 1, approx. 20:30–21:30", "ts": ""}, "MM 2": {"t": "Device database", "f": "AP plus", "o": "Christian Sill: clarify whether the job also updates changes (moved devices).", "s": "See Salesforce no. 5. The THOR job 'Gerätedatenbank' (device database) transfers installations from AP plus to 'Poolanlagen', serial numbers to 'Poolgeräte' and the articles (products, expiring parts, options). The pool tables are in the MyMOBS database, separate from MyMOBS Live. The job continues like this.\n→ BPMN 05", "q": "workshop part 3, approx. 13:00–20:40", "ts": ""}, "MM 3": {"t": "Maintenance contracts", "f": "Salesforce (maintenance contract)", "ts": "", "s": "Goal: service level and partner remain on the customer in MyMOBS. The source is now the maintenance contract in Salesforce, no longer AP plus.\n\n1. The maintenance contract is created, activated or changed in Salesforce (Salesforce no. 20).\n2. The integration writes service level and partner to the customer in MyMOBS.\n3. The contract itself stays only in Salesforce; it is not displayed in MyMOBS.\n\nThe sync of contracts with AP plus is dropped.", "q": "", "o": "Wondercode: define the field mapping Salesforce maintenance contract → MyMOBS customer.\nMissing data: today the maintenance contract in Salesforce has no partner (it comes from AP plus). Without it the partner cannot be written to MyMOBS."}, "MM 4": {"t": "Portal users", "f": "MyMOBS (users); Salesforce only the trigger", "o": "", "s": "See Salesforce no. 7. Direction Salesforce → MyMOBS (corrected in the workshop).\nJulian enters the contact in the account field 'MyMOBS Admin', the integration creates the admin in MyMOBS and sends the credentials via Brevo. Further users are created by the customer admin. Stays like this until MyMOBS V2.\n→ BPMN 02", "q": "workshop part 3, approx. 09:30–13:00 and 20:40–24:15; part 1, approx. 22:30 and 45:00", "ts": ""}, "MM 5": {"t": "Emergency contacts", "f": "MyMOBS", "o": "", "s": "Goal: if MyMOBS fails, C.M. Heim can still inform all customer admins.\n\n1. The integration regularly reads all admin users (name, email) from MyMOBS.\n2. It writes them as an Excel file to the file share on the intranet and overwrites the file completely each time.\n\nPure backup, no management, nothing flows back. Stays as is.\n→ BPMN 02", "q": "workshop part 3, approx. 24:25–28:20", "ts": ""}, "MM 6": {"t": "Support ticket 24/7", "f": "Salesforce (customer case)", "o": "", "ts": "", "s": "If the call centre (support request 1, with operator password) or the customer (support request 2) fills in a support request in MyMOBS, a customer case is created in Salesforce.\nStays as today (Web2Case), no action needed for the THOR successor.\n→ BPMN 10\nIf the customer calls, Technical Support creates the customer case manually (see Salesforce no. 12).", "q": "Workshop part 3, approx. 28:24–32:47; Confluence (call centre support request)"}, "MM 7": {"t": "Request replacement device", "f": "Salesforce (customer case)", "o": "", "s": "Out of scope: MyMOBS functions cannot be further developed within this project. A replacement device request directly in MyMOBS is therefore not possible.\n\nThe customer reports a defect as today by phone or via the existing support request in MyMOBS (no. 6); this creates a customer case in Salesforce. The replacement process itself is Salesforce no. 12.", "q": "", "ts": "Request replacement device in MyMOBS (not possible)"}, "MM 8": {"t": "Portal users into the Data Warehouse", "f": "MyMOBS", "o": "C.M. Heim: confirm.", "s": "If users are created or changed in MyMOBS, all users per customer are visible in the Data Warehouse.\nToday there is no overview in Salesforce of which admins have been created.\n→ BPMN 02", "q": "workshop part 1, approx. 21:32 and 47:43", "ts": ""}, "MM 9": {"t": "Portal offboarding", "f": "MyMOBS", "o": "", "s": "Out of scope (decision 25.11.2026).\n\nToday: if the contact in the field 'MyMOBS Admin' is replaced, the old admin stays active. There is no offboarding of users.\n→ BPMN 02", "q": "workshop part 1, approx. 44:06–45:58; part 2, approx. 04:56–05:12", "ts": ""}, "Mon 2": {"t": "Assign SFC order to a Monday board", "f": "Salesforce (order); Monday (execution)", "ts": "", "s": "Goal: partner orders go to the right Monday board from Salesforce at the push of a button instead of being copied manually.\n\n1. A partner order (all order types except purchase/rental, e.g. installation, commissioning, training, removal, service) is created in Salesforce.\n2. The partner is selected on the order via a button (the partner is not stored in Salesforce today).\n3. The task is created on the partner's board in the group for the order type. The order is thus scheduled.\n4. The Monday task is linked on the order in Salesforce.\n5. In Monday the partner may change everything except the order number (key).\n\nMonday stays as long as it works; Salesforce Field Service is too expensive and too complex. Monday itself does not trigger other systems.\n→ BPMN 06\nRole according to Confluence: Order Management puts the task on the partner board.", "q": "Workshop part 3, approx. 01:09:46–01:13:00, 01:34:50–01:41:07, 01:47:00 and 02:00:46–02:03:00; part 2, approx. 06:58–08:01", "o": "C.M. Heim: provide test boards and an admin token.\nC.M. Heim: in future adjust orders instead of deleting and recreating them. Otherwise the links to Monday, purchase order and Data Warehouse break.\nWondercode: check whether Monday provides a unique ID and whether a ready-made Monday integration for Salesforce exists.\nConflict with Salesforce no. 15: there the task goes to Monday automatically on release, here via a button. Which applies?\nWondercode + C.M. Heim: The functionality (partner selection via button, task on the right board) must be built in Salesforce. This needs a mapping: partner → Monday board and order type → group on the board. Who provides the mapping, and where is it maintained?"}, "Mon 3": {"t": "Assign SFC maintenance contract to a Monday board", "f": "Salesforce (maintenance contract)", "ts": "", "s": "Goal: the maintenance tasks per quarter are created from Salesforce at the push of a button instead of about 4 hours of manual copying per quarter.\n\n1. The maintenance contract (IHV) contains the next service (quarter, inspection or maintenance, depending on the service level).\n2. Via the button 'Task to Monday' on the maintenance contract, type (inspection/maintenance), quarter and partner are queried.\n3. The task (project name, contract number, type, quarter) is created on the partner's board and linked to the maintenance contract.\n4. You agree the actual date with the partner in Monday; the partner has the whole quarter.\n\nPossible later: create all maintenance due in a quarter at once.\n→ BPMN 08\nRole according to Confluence: the back office puts the maintenance tasks on the board and agrees the date with customer and partner.", "q": "Workshop part 3, approx. 01:11:12 and 01:23:37–01:28:36", "o": "C.M. Heim: Should all contracts due in a quarter be created at once?\nWondercode: The button 'Task to Monday' on the maintenance contract (querying type, quarter, partner) still has to be built in Salesforce."}, "Mon 4": {"t": "Trigger purchase order in AP+ from monday.com", "f": "Salesforce (trigger); AP plus (purchase order)", "s": "Goal: every engagement of a service partner runs as a purchase order via AP plus (requirement, about 20 per week), triggered from Salesforce instead of via a message in Monday.\n\n1. A service order (installation, commissioning, removal, fault clearance, maintenance, aerial work platform) is created in Salesforce.\n2. The partner is selected on the order via the button 'Purchase proposal to partner'.\n3. In AP plus a purchase proposal is created in Purchasing with the line items service technician working time (hours) and travel (km).\n4. Purchasing places the order and sends it to the partner (today Alexandra, from January 2027 Purchasing).\n5. Checking the partner invoice against the purchase order and work report stays manual.\n\nNot triggered from Monday: Monday should not trigger other systems.\n→ BPMN 06, 08", "q": "workshop part 3, approx. 01:11:12, 01:13:28–01:17:44 and 01:42:36–02:00:37", "ts": "Trigger the partner purchase order from Salesforce", "o": "C.M. Heim: one purchase order per service order? Today Heike sometimes combines several orders into one purchase order.\nC.M. Heim: confirm partners as suppliers in AP plus.\nPartner quote: according to Confluence, Order Management first obtains a quote from the partner, then Purchasing orders. Here it goes straight to the purchase proposal. Does the partner quote stay?\nC.M. Heim: Is the account type Partner/Hybrid the definition of a service partner, and does every partner exist as a supplier in AP plus?"}, "Mon 5": {"t": "Status from Monday", "f": "Monday (execution)", "o": "C.M. Heim: Should the status from Monday come to Salesforce?\nWondercode: check whether Monday provides a unique ID.", "s": "Question in the workshop: what comes back from Monday to Salesforce? At least the status; today the statuses in Monday and Salesforce do not match.\nThe status could be returned using the order or contract number as the key. Monday does not trigger any further processes.\nNot decided.\n→ BPMN 06", "q": "workshop part 3, approx. 01:37:13–01:38:46", "ts": ""}, "Mon 6": {"t": "Monday data into the Data Warehouse", "f": "Monday", "o": "C.M. Heim: Is this needed?", "s": "Raised as a question in the workshop: are Monday data (e.g. dates, status) needed in the Data Warehouse? Not answered.", "q": "workshop part 3, approx. 01:09:46", "ts": ""}, "Red 1": {"t": "Create escalated customer cases in Redmine", "f": "Salesforce (customer case)", "o": "C.M. Heim: clarify internally whether and how the connection is wanted.", "s": "Request: create escalated customer cases from Salesforce as tickets in Redmine (manual today). Tickets by email would be possible, but without feedback this is of little use.\nResult: not a direct Data Warehouse topic, deferred; C.M. Heim will align internally.\n→ BPMN 10", "q": "workshop part 3, approx. 35:02–35:23 and 02:03:00–02:04:36", "ts": ""}, "SF 20": {"ts": "", "t": "Create and activate maintenance contract", "f": "Salesforce (maintenance contract)", "s": "Goal: maintenance contracts (IHV) are created and maintained in Salesforce only. They trigger MyMOBS no. 3 (service level and partner), Monday no. 3 (quarterly task) and no. 10 (maintenance material).\n\n1. Technical Support confirms the IHV order and creates the maintenance order (service level, interval, next service).\n2. Once the IHV order is delivered, the back office sets it to 'geliefert' (delivered) and activates the contract.\n3. The installations to be maintained are assigned to the maintenance contract (no. 16).\n\nThese steps run in Salesforce as today. The sync with AP plus is dropped (no. 6).", "q": "Confluence 5.8 (IHV order); previously described in no. 6 and MyMOBS no. 3", "o": "C.M. Heim: What does Technical Support check when confirming ('Was prüfen??' in Confluence)?\nC.M. Heim: SL5 standby (operator password, connection sheet to the partner, MyMOBS access by Technical Support) is not covered. Does it stay manual?\nC.M. Heim: Can an installation belong to different maintenance contracts over time? Then an assignment with validity dates is needed."}};

const GE={

 B11:["M","Customer identity and branch structure","Companies in AP plus are matched by name, city and street. Only 203 of 6,372 accounts use a parent account; branches look like duplicates.","With “Closed Won” as an automatic trigger, a wrong match would create or reuse the wrong customer.","Account hierarchy, a custom duplicate rule, matching on the customer number first."],
 B12:["L","Legacy and unused objects","Order__c and Quote__c have been retired since April 2024 but are still referenced. Field Service is not live; leftovers (21 flows, licences) remain.","Little direct impact, but history for the Data Warehouse sits on Order__c.","Keep Order__c read-only, remove Field Service leftovers and the test quick action."],
 B13:["M","AP order numbers not unique","Three AP order numbers sit on two orders each.","AP number, Monday task, purchase order and Data Warehouse hang on the order. Duplicate or recreated orders break these links.","Make AP_Auftrags_ID__c unique, check for duplicates before the hand-over, rule “change orders, never recreate them”."],
 B14:["M","Delivery address is unstructured","The order has one delivery address. Multi-line streets are not cleaned; postcode and country are ignored when matching.","The target requires a correct delivery address on every order and when the customer is created.","Mandatory, structured delivery address on account and order, matching on postcode and country."],

/* Ablaufbild */
function wrap(t,max){const w=[];t.split(" ").forEach(x=>{while(x.length>max+1){w.push(x.slice(0,max)+"-");x=x.slice(max);}w.push(x);});const L=[];let c="";w.forEach(x=>{if((c+" "+x).trim().length>max&&c){L.push(c);c=x;}else c=(c+" "+x).trim();});if(c)L.push(c);return L;}
function drawLanes(p){
  const LW=86,CW=134,BW=120,LH=15;
  const steps=p.steps.map((s,i)=>{const lines=wrap(s.t,15);const top=s.k==="s"?14:30;return {...s,i:i+1,lines,top,h:top+lines.length*LH+22,cst:stepStatus(p,i+1)};});
  const laneH={};p.lanes.forEach(l=>laneH[l]=74);
  steps.forEach(s=>laneH[s.l]=Math.max(laneH[s.l],s.h+26));
  const laneY={};let y=0;p.lanes.forEach(l=>{laneY[l]=y;y+=laneH[l];});
  const W=LW+(Math.max(...steps.map(s=>s.c))+1)*CW+10,H=y;
  steps.forEach(s=>{s.x=LW+s.c*CW+10;s.y=laneY[s.l]+(laneH[s.l]-s.h)/2;s.cy=s.y+s.h/2;});
  let o=`<svg width="100%" height="${H}" style="min-width:${W}px" role="img" aria-label="Ablaufbild ${esc(p.title)}"><defs>
   <marker id="a-${p.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
   <marker id="b-${p.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" class="ah2"/></marker></defs>`;
  p.lanes.forEach((l,i)=>{const col=SYS[l][1];
    o+=`<rect x="0" y="${laneY[l]}" width="100%" height="${laneH[l]}" fill="color-mix(in srgb, ${col} ${i%2?5:8}%, var(--surface))"/>`;
    o+=`<text class="lane-label" x="14" y="${laneY[l]+laneH[l]/2+4}" fill="${col}">${SYS[l][0]}</text>`;
    if(i>0)o+=`<line x1="0" x2="100%" y1="${laneY[l]}" y2="${laneY[l]}" stroke="var(--line)"/>`;});
  p.edges.forEach(([a,b])=>{const A=steps[a-1],B=steps[b-1];const integ=B.k==="s"&&A.l!==B.l;let d;
    if(B.c>A.c){const sx=A.x+BW,sy=A.cy,ex=B.x-2,ey=B.cy,mx=B.x-9;d=Math.abs(sy-ey)<1?`M${sx},${sy}H${ex}`:`M${sx},${sy}H${mx}V${ey}H${ex}`;}

    o+=`<path d="${d}" class="${integ?"e-int":"e-flow"}" marker-end="url(#${integ?"a":"b"}-${p.id})"/>`;});
  steps.forEach(s=>{const col=SYS[s.l][1];

const NAV=[];const dback=document.getElementById("dback");
const navLabel=x=>x.type==="step"?"Schritt "+x.i:x.type==="req"?x.k:x.type==="gap"?x.id:x.o;
function updBack(){dback.hidden=!NAV.length;if(NAV.length)dback.textContent="← "+navLabel(NAV[NAV.length-1]);}
function reopen(c){if(c.type==="step")openStep(c.pid,c.i);else if(c.type==="req")openReq(c.k);else if(c.type==="gap")openGap(c.id);else if(c.type==="obj")openObj(c.o);}

/* Neu zeichnen, wenn sich der gemeinsame Stand ändert, ohne Eingaben zu verlieren */
let refreshQueued=false;
function refresh(){if(refreshQueued)return;refreshQueued=true;requestAnimationFrame(()=>{refreshQueued=false;doRefresh();});}
function doRefresh(){
  renderNav(curView);
  const ae=document.activeElement;const typingMain=ae&&document.getElementById("main").contains(ae)&&/input|textarea/i.test(ae.tagName);
  if(curView==="entscheide"){
    document.querySelectorAll("[data-drow]").forEach(li=>{const id=li.dataset.drow;const st=decState(id);const s=st.s||"offen";
      li.querySelectorAll("[data-dec]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===s));
      const inp=li.querySelector("[data-note]");if(inp&&inp!==ae)inp.value=st.n||"";});
  }else if(!typingMain){render(true);reapplyMarks();}
  if(!dr.hidden){
    db_.querySelectorAll("[data-stwrap]").forEach(w=>{const t=w.dataset.stwrap;const sel=w.querySelector("select");if(sel===ae)return;
      let v;if(t.startsWith("req:"))v=reqStatus(t.slice(4).replace("-"," "));else{const [p,i]=t.slice(5).split("-");v=stepStatus(P.find(x=>x.id===p),+i);}
      if(sel){sel.value=v;const dot=w.querySelector(".dot");if(dot)dot.className="dot "+v;}else w.innerHTML=stHTML(v);});
    db_.querySelectorAll("[data-hist]").forEach(ul=>{const items=logFor(ul.dataset.hist);ul.innerHTML=items.map(x=>histItem(x,false)).join("");ul.hidden=!items.length;const w=ul.closest("[data-histwrap]");if(w)w.hidden=!items.length&&!CANWRITE;});
    fillNames(db_);
  }

/* Schreiben */
const nowIso=()=>new Date().toISOString();
let busy=Promise.resolve();
const queue=fn=>{busy=busy.then(fn).catch(e=>{toast(e&&e.code==="quota_exceeded"?"Speicher voll: Eintrag nicht gespeichert.":"Konnte nicht speichern. Bitte nochmals versuchen.");});return busy;};
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true;},3500);}
function addLog(e){return db.collection("log").add({...e,by:ME,at:nowIso()});}
function setStatus(t,val){
  if(!db||!CANWRITE)return;
  let old;if(t.startsWith("req:"))old=reqStatus(t.slice(4).replace("-"," "));else{const [p,i]=t.slice(5).split("-");old=stepStatus(P.find(x=>x.id===p),+i);}
  if(old===val)return;
  ST[t]={s:val,by:ME,at:nowIso()};refresh();
  queue(async()=>{await db.doc("status/"+keyPath(t)).set({t,s:val,by:ME,at:nowIso()});});
}
function sendComment(t){
  const ta=document.querySelector(`[data-ctext="${t}"]`);if(!ta)return;const text=ta.value.trim();if(!text||!db||!CANWRITE)return;
  ta.value="";queue(async()=>{await addLog({t,kind:"comment",text:text.slice(0,2000)});toast("Eingetragen.");});
}
function setDecision(id,val,note){
  if(!db||!CANWRITE)return;const st=decState(id);const s=val??(st.s||"offen");const n=note??(st.n||"");
  if(s===(st.s||"offen")&&n===(st.n||""))return;
  DEC[id]={s,n,by:ME,at:nowIso()};refresh();
  queue(async()=>{await db.doc("dec/"+id).set({id,s,n,by:ME,at:nowIso()});});
}

/* Ereignisse */
document.addEventListener("click",e=>{
  const lg=e.target.closest("[data-lang]");if(lg){setLang(lg.dataset.lang);return;}
  const dt=e.target.closest("[data-dtab]");if(dt){if(!dt.disabled){DTAB=dt.dataset.dtab;if(cur&&cur.type==="step")openStep(cur.pid,cur.i);}return;}
  const inD=!!e.target.closest("#drawer");const nav=()=>{if(inD&&cur&&!dr.hidden)NAV.push({...cur,dtab:DTAB,sc:db_.scrollTop});else NAV.length=0;};
  if(e.target.closest("#dback")){goBack();return;}
  const st=e.target.closest(".stepbox");if(st){NAV.length=0;openStep(st.dataset.p,+st.dataset.i);return;}
  const cs=e.target.closest("[data-csend]");if(cs){sendComment(cs.dataset.csend);return;}
  const gp=e.target.closest("[data-gap]");if(gp){nav();openGap(gp.dataset.gap);return;}
  const ob=e.target.closest("[data-obj]");if(ob){nav();openObj(ob.dataset.obj);return;}
  const rq=e.target.closest("[data-req]");if(rq){nav();openReq(rq.dataset.req);return;}
  const dv=e.target.closest("[data-dec]");if(dv){if(!dv.disabled)setDecision(dv.dataset.dec,dv.dataset.v,null);return;}
  if(e.target.id==="copyall"){copyAll();return;}
  if(!dr.hidden&&!e.target.closest("#drawer")&&!e.target.closest("#toast"))closeDrawer();
});
document.addEventListener("change",e=>{
  const sel=e.target.closest&&e.target.closest("[data-stsel]");if(sel){setStatus(sel.dataset.stsel,sel.value);return;}
  const n=e.target.dataset&&e.target.dataset.note;if(n){const v=e.target.value.trim();const st=decState(n);setDecision(n,v&&(!st.s||st.s==="offen")?"entschieden":null,v);}
});
document.addEventListener("keydown",e=>{
  const st=e.target.closest&&e.target.closest(".stepbox");
  if(st&&(e.key==="Enter"||e.key===" ")){e.preventDefault();NAV.length=0;openStep(st.dataset.p,+st.dataset.i);return;}
  if(e.target.dataset&&e.target.dataset.ctext&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();sendComment(e.target.dataset.ctext);return;}
  if(/input|textarea|select/i.test(e.target.tagName))return;
  if(e.key==="Escape"&&!dr.hidden){closeDrawer();return;}
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  if(!dr.hidden&&cur&&cur.type==="step"){openStep(cur.pid,cur.i+(e.key==="ArrowRight"?1:-1));return;}
  if(dr.hidden){const i=VIEWS.indexOf(curView)+(e.key==="ArrowRight"?1:-1);if(i>=0&&i<VIEWS.length)location.hash=VIEWS[i]+(MODE==="technik"&&(VIEWS[i].startsWith("p")||VIEWS[i]==="grundlagen")?"-technik":"");}
});
dprev.addEventListener("click",()=>cur&&cur.type==="step"&&openStep(cur.pid,cur.i-1));
dnext.addEventListener("click",()=>cur&&cur.type==="step"&&openStep(cur.pid,cur.i+1));

function copyAll(){

  const txt=lines.join("\n");const out=document.getElementById("copyout"),msg=document.getElementById("copymsg");
  const fb=()=>{out.hidden=false;out.value=txt;out.focus();out.select();msg.textContent="Text markiert. Mit Cmd/Ctrl+C kopieren.";};

/* Gemeinsamen Stand laden */
(async()=>{
  try{
    db=await window.claude?.use?.("db");usr=await window.claude?.use?.("user");
  }catch(e){db=null;}
  if(!db){renderNav(curView);return;}
  if(usr){try{ME=await usr.id();}catch(e){}try{const c=await usr.can("data.write");CANWRITE=c===null?!!ME:c;}catch(e){CANWRITE=!!ME;}}
  const timer=setTimeout(()=>{if(!LOADED){toast("Gemeinsamer Stand kann gerade nicht geladen werden.");}},10000);
  let got=0;const done=()=>{if(++got>=3&&!LOADED){LOADED=true;clearTimeout(timer);const c=cur;render(true);if(c&&!dr.hidden){reopen(c);}}};
  const onErr=()=>{clearTimeout(timer);toast("Gemeinsamer Stand nicht erreichbar. Anzeige ohne Änderungen.");CANWRITE=false;LOADED=true;refresh();};
  let s1=false,s2=false,s3=false;
  db.collection("status").onSnapshot(snap=>{Object.keys(ST).forEach(k=>delete ST[k]);snap.docs.forEach(d=>{const v=d.data();if(v&&v.t)ST[v.t]=v;});if(!snap.metadata.fromCache&&!s1){s1=true;done();}refresh();},onErr);
  db.collection("dec").onSnapshot(snap=>{Object.keys(DEC).forEach(k=>delete DEC[k]);snap.docs.forEach(d=>{const v=d.data();if(v&&v.id)DEC[v.id]=v;});if(!snap.metadata.fromCache&&!s2){s2=true;done();}refresh();},onErr);
  db.collection("log").orderBy("at","desc").limit(1000).onSnapshot(snap=>{LOG=snap.docs.map(d=>d.data()).filter(Boolean);if(!snap.metadata.fromCache&&!s3){s3=true;done();}refresh();},onErr);
})();

}
function appEN(){
/* Hilfen */
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const regOf=k=>REG.find(x=>x[0]+" "+x[1]===k);
const lead=k=>{const g=regOf(k);return g&&g[5]?g[5]:k;};
const leads=s=>[...new Set(s.r.map(lead))];
const titleOf=k=>{const d=SOLL[k]||{},g=regOf(k);return d.ts||(g?g[2]:d.t)||k;};
const reqsOf=pid=>REG.filter(x=>x[4].includes(pid)&&!x[5]).map(x=>x[0]+" "+x[1]);
const VIEWS=["uebersicht",...P.map(p=>p.id.toLowerCase()),"grundlagen"];
let MODE="soll";
const ST_ORDER=["E","F","V","O","Z","X","N"];

/* Geteilter Stand (db): Status-Änderungen, Entscheide, Verlauf */
const ST={},DEC={};let LOG=[];
let db=null,usr=null,ME=null,CANWRITE=false,LOADED=false;
const tReq=k=>"req:"+k.replace(" ","-");
const tStep=(pid,i)=>"step:"+pid+"-"+i;
const tDec=id=>"dec:"+id;
const keyPath=t=>t.replace(":","_");
const reqStatus=k=>{const o=ST[tReq(k)];if(o&&o.s)return o.s;const g=regOf(k);return g?g[3]:"";};
function stepStatus(p,i){const s=p.steps[i-1];const o=ST[tStep(p.id,i)];if(o&&o.s)return o.s;
  for(const k of leads(s)){const r=ST[tReq(k)];if(r&&r.s)return r.s;}return s.st||"";}
const logFor=t=>LOG.filter(x=>x.t===t&&x.kind==="comment");
const stHTML=s=>s?`<span class="st ${s}">${STN[s]}</span>`:"";

/* Entscheide */
const allDecs=()=>[...P.map(p=>({grp:p.id,title:p.title,list:p.dec.map((d,i)=>({id:p.id.slice(1)+"."+(i+1),q:d[0],r:d[1]}))})),
  {grp:"Q",title:"Foundations and data",list:QDEC.map((d,i)=>({id:"G."+(i+1),q:d[0],r:d[1]}))}];
const decState=id=>DEC[id]||{};
const openCount=list=>list.filter(d=>!(decState(d.id).s&&decState(d.id).s!=="offen")).length;

/* Navigation */
function renderNav(cur){
  const g=allDecs();const oc=pid=>openCount(g.find(x=>x.grp===pid).list);
  document.getElementById("side").innerHTML=`
   <div class="brand"><b>C.M. Heim</b><span>Target processes, THOR successor</span></div>
   ${langSw()}<div class="navgrp"><a href="#uebersicht" class="${cur==="uebersicht"?"on":""}"><span class="no">·</span>Overview<span></span></a></div>
   <div class="navgrp"><span class="lab">Processes</span>${P.map(p=>`<a href="#${p.id.toLowerCase()}" class="${cur===p.id.toLowerCase()?"on":""}"><span class="no">${p.id.slice(1)}</span>${p.title}<span class="cnt ${oc(p.id)?"has":""}">${oc(p.id)||"✓"}</span></a>`).join("")}</div>
   <div class="navgrp"><span class="lab">More</span>
     <a href="#grundlagen" class="${cur==="grundlagen"?"on":""}"><span class="no">G</span>Foundations and data<span class="cnt ${oc("Q")?"has":""}">${oc("Q")||"✓"}</span></a></div>
   <div class="foot">${LOADED?(CANWRITE?"Changes and comments are saved for everyone.":"View only. Changes require at least “Contributor” access."):(db?"Loading shared state …":"View only. The shared state is not available in this view.")}<br><br>As of 25.11.2026<br>Based on: workshop, Confluence, Excel target v8</div>`;
}

/* Ablaufbild */
function wrap(t,max){const w=[];t.split(" ").forEach(x=>{while(x.length>max+1){w.push(x.slice(0,max)+"-");x=x.slice(max);}w.push(x);});const L=[];let c="";w.forEach(x=>{if((c+" "+x).trim().length>max&&c){L.push(c);c=x;}else c=(c+" "+x).trim();});if(c)L.push(c);return L;}
function drawLanes(p){
  const LW=86,CW=134,BW=120,LH=15;
  const steps=p.steps.map((s,i)=>{const lines=wrap(s.t,15);const top=s.k==="s"?14:30;return {...s,i:i+1,lines,top,h:top+lines.length*LH+22,cst:stepStatus(p,i+1)};});
  const laneH={};p.lanes.forEach(l=>laneH[l]=74);
  steps.forEach(s=>laneH[s.l]=Math.max(laneH[s.l],s.h+26));
  const laneY={};let y=0;p.lanes.forEach(l=>{laneY[l]=y;y+=laneH[l];});
  const W=LW+(Math.max(...steps.map(s=>s.c))+1)*CW+10,H=y;
  steps.forEach(s=>{s.x=LW+s.c*CW+10;s.y=laneY[s.l]+(laneH[s.l]-s.h)/2;s.cy=s.y+s.h/2;});
  let o=`<svg width="100%" height="${H}" style="min-width:${W}px" role="img" aria-label="Process diagram ${esc(p.title)}"><defs>
   <marker id="a-${p.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
   <marker id="b-${p.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" class="ah2"/></marker></defs>`;
  p.lanes.forEach((l,i)=>{const col=SYS[l][1];
    o+=`<rect x="0" y="${laneY[l]}" width="100%" height="${laneH[l]}" fill="color-mix(in srgb, ${col} ${i%2?5:8}%, var(--surface))"/>`;
    o+=`<text class="lane-label" x="14" y="${laneY[l]+laneH[l]/2+4}" fill="${col}">${SYS[l][0]}</text>`;
    if(i>0)o+=`<line x1="0" x2="100%" y1="${laneY[l]}" y2="${laneY[l]}" stroke="var(--line)"/>`;});
  p.edges.forEach(([a,b])=>{const A=steps[a-1],B=steps[b-1];const integ=B.k==="s"&&A.l!==B.l;let d;
    if(B.c>A.c){const sx=A.x+BW,sy=A.cy,ex=B.x-2,ey=B.cy,mx=B.x-9;d=Math.abs(sy-ey)<1?`M${sx},${sy}H${ex}`:`M${sx},${sy}H${mx}V${ey}H${ex}`;}
    else{const dn=B.y>A.y,sx=A.x+BW/2;d=`M${sx},${dn?A.y+A.h:A.y}V${dn?B.y-2:B.y+B.h+2}`;}
    o+=`<path d="${d}" class="${integ?"e-int":"e-flow"}" marker-end="url(#${integ?"a":"b"}-${p.id})"/>`;});
  steps.forEach(s=>{const col=SYS[s.l][1];
    const cls=s.k==="m"?`class="box-m"`:s.k==="s"?`fill="color-mix(in srgb, ${col} 18%, var(--surface))" stroke="${col}" stroke-width="1.2"`:`class="box-p"`;
    const nc=logFor(tStep(p.id,s.i)).filter(x=>x.kind==="comment").length;
    o+=`<g class="stepbox${s.k==="m"?" m":""}" data-p="${p.id}" data-i="${s.i}" tabindex="0" role="button" aria-label="Step ${s.i}: ${esc(s.t)}"><rect x="${s.x}" y="${s.y}" width="${BW}" height="${s.h}" rx="7" ${cls}/>`;
    o+=`<text class="bnum" x="${s.x+10}" y="${s.y+s.h-8}">${s.i}${nc?` · ${nc} comment${nc>1?"s":""}`:""}</text>`;
    if(s.k!=="s")o+=`<text class="brole" x="${s.x+10}" y="${s.y+17}">${esc(s.w||"")}</text>`;
    s.lines.forEach((ln,j)=>o+=`<text class="btxt" x="${s.x+10}" y="${s.y+s.top+8+j*LH}">${esc(ln)}</text>`);
    if(s.cst)o+=`<circle cx="${s.x+BW-11}" cy="${s.y+s.h-12}" r="4" class="sd-${s.cst}"><title>${STN[s.cst]}</title></circle>`;
    o+=`</g>`;});
  return o+"</svg>";
}
const LEG=`<div class="legend"><span class="hint">Click a step or a requirement for the target flow, status and comments.</span>
 <span><i class="lp"></i>Person</span><span><i class="ls"></i>automatic</span><span><i class="lm"></i>stays manual</span>
 <span class="st E">decided</span><span class="st V">proposal</span><span class="st O">open</span></div>`;

/* Bausteine */
const ccount=t=>{const n=logFor(t).filter(x=>x.kind==="comment").length;return n?`<span class="cc" title="${n} comment${n>1?"s":""}">${n}</span>`:"";};
const reqList=keys=>`<ul class="list">${keys.map(k=>`<li><button class="req" type="button" data-req="${k}"><span class="id">${k}</span><span class="t">${esc(titleOf(k))}</span><span class="rt">${ccount(tReq(k))}${stHTML(reqStatus(k))}</span></button></li>`).join("")}</ul>`;

/* Verlauf */
const fmt=iso=>{try{return new Date(iso).toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}};
function targetLabel(t){const [k,v]=t.split(":");if(k==="req")return v.replace("-"," ");if(k==="step"){const [p,i]=v.split("-");const pp=P.find(x=>x.id===p);return pp?`${pp.title}, step ${i}`:v;}if(k==="dec")return "Decision "+v;return v;}
function histItem(x,withTarget){
  let body="";
  if(x.kind==="status")body=`Status: ${esc(STN[x.from]||"–")} → <b>${esc(STN[x.to]||x.to)}</b>`;
  else if(x.kind==="decision")body=`Decision: <b>${x.to==="entschieden"?"Decided":x.to==="zurueck"?"Deferred":"Open"}</b>${x.text?" – "+esc(x.text):""}`;
  else body=`<span class="ctext">${esc(x.text)}</span>`;
  return `<li class="hi"><div class="hm"><span class="who" data-uid="${esc(x.by||"")}">…</span><span>${fmt(x.at)}</span>${withTarget?`<span>${esc(targetLabel(x.t))}</span>`:""}</div><div class="hb">${body}</div></li>`;
}
function histBlock(t){
  const items=logFor(t);
  return `<div class="sec hist" data-histwrap="${t}" ${!items.length&&!CANWRITE?"hidden":""}><span>Comments</span>
   <ul class="hist-list" data-hist="${t}" ${items.length?"":"hidden"}>${items.map(x=>histItem(x,false)).join("")}</ul>
   ${CANWRITE?`<div class="cbox"><textarea id="c-${t.replace(/[^a-zA-Z0-9]/g,"_")}" data-ctext="${t}" rows="2" maxlength="2000" placeholder="Comment or outcome from the meeting …"></textarea><button class="ib" type="button" data-csend="${t}">Add</button></div>`:""}</div>`;
}
async function fillNames(root){
  if(!usr)return;const els=[...(root||document).querySelectorAll(".who[data-uid]")];const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];
  let ps={};try{ps=ids.length?await usr.profiles(ids):{};}catch(e){}
  els.forEach(e=>{const p=ps[e.dataset.uid];e.textContent=(p&&p.name)||(p&&p.isMe?"You":"Someone");});

let curView="uebersicht";

  let h=(location.hash||"").slice(1);let md="soll";if(h.endsWith("-technik")){md="technik";h=h.slice(0,-8);}

function mark(pid,i,rel){
