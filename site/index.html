<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prozesslandkarte C.M. Heim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: App mit linker Navigation (Übersicht, 7 Prozesse, Grundlagen, Abgrenzung, Entscheide); rechts eine Ansicht pro Thema; Details im Seitenpanel */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --sunk:#EEF0F3; --fg:#14171F; --muted:#667085; --faint:#98A2B3; --line:#E3E6EB;
  --accent:#B3202A; --accent-soft:#FBEDEE;
  --sf:#2563A8; --ap:#C0661A; --mm:#0E8A7B; --mon:#7448B8; --kwp:#5B7A1F; --ext:#8A919E;
  --ok:#1F7A4D; --wait:#B26B00; --open:#C2353F; --off:#8A919E;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#161A20; --sunk:#1D222A; --fg:#E7EAEE; --muted:#9AA3AF; --faint:#6B7480; --line:#2A3039;
  --accent:#F26B73; --accent-soft:#3A1E22;
  --sf:#6AA6E8; --ap:#EE9A55; --mm:#3CC2B0; --mon:#AE8CEA; --kwp:#A6C45E; --ext:#8C95A3;
  --ok:#6FCB95; --wait:#E8B84E; --open:#F2848C; --off:#8C95A3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#161A20; --sunk:#1D222A; --fg:#E7EAEE; --muted:#9AA3AF; --faint:#6B7480; --line:#2A3039;
  --accent:#F26B73; --accent-soft:#3A1E22;
  --sf:#6AA6E8; --ap:#EE9A55; --mm:#3CC2B0; --mon:#AE8CEA; --kwp:#A6C45E; --ext:#8C95A3;
  --ok:#6FCB95; --wait:#E8B84E; --open:#F2848C; --off:#8C95A3; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);
  padding:22px 14px 22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.brand{display:grid;gap:2px;padding:0 8px}
.brand b{font-size:15px;font-weight:600}
.brand span{font-size:12.5px;color:var(--muted)}
.navgrp{display:grid;gap:2px}
.navgrp .lab{font-size:11.5px;color:var(--faint);padding:0 8px 4px;letter-spacing:.02em}
.navgrp a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;text-decoration:none;color:var(--fg);font-size:14px}
.navgrp a:hover{background:var(--sunk)}
.navgrp a.on{background:var(--sunk);font-weight:600}
.navgrp a .no{font-family:var(--mono);font-size:12px;color:var(--faint)}
.navgrp a.on .no{color:var(--accent)}
.navgrp a .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.navgrp a .cnt.has{color:var(--open)}
.side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:0 8px;line-height:1.45}

main{min-width:0;padding:36px max(16px,min(48px,4vw)) 64px}
.view{max-width:1600px;display:grid;gap:28px}
.kicker{font-size:13px;color:var(--muted)}
.vh{display:grid;gap:8px}
.vh h1{font-size:clamp(26px,3vw,34px)}
.goal{font-size:17px;color:var(--fg);max-width:70ch;line-height:1.5}
.goal.muted{color:var(--muted)}

/* Diagramm */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.dia svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .lp{background:var(--surface);border:1px solid var(--line)}
.legend .ls{background:color-mix(in srgb,var(--sf) 20%,var(--surface));border:1px solid var(--sf)}
.legend .lm{background:var(--bg);border:1px dashed var(--faint)}
.legend .hint{color:var(--fg)}

.lane-label{font-family:var(--sans);font-size:12.5px;font-weight:600}
.btxt{font-family:var(--sans);font-size:12px;fill:var(--fg)}
.brole{font-family:var(--sans);font-size:10.5px;fill:var(--muted)}
.box-p{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.box-m{fill:var(--bg);stroke:var(--faint);stroke-width:1;stroke-dasharray:4 3}
.stepbox.m .btxt{fill:var(--muted)}
.bnum{font-family:var(--mono);font-size:10.5px;fill:var(--faint)}
.e-int{fill:none;stroke:var(--fg);stroke-width:1.4;opacity:.75}
.e-flow{fill:none;stroke:var(--faint);stroke-width:1.1;stroke-dasharray:3 3}
.ah{fill:var(--fg);opacity:.75}.ah2{fill:var(--faint)}
.sd-E{fill:var(--ok)}.sd-V,.sd-F{fill:var(--wait)}.sd-O{fill:var(--open)}.sd-Z,.sd-X,.sd-N{fill:var(--off)}
.stepbox{cursor:pointer}
.stepbox:hover > rect:first-child{stroke:var(--fg)}
.stepbox:focus{outline:none}
.stepbox:focus-visible > rect:first-child,.stepbox.sel > rect:first-child{stroke:var(--accent);stroke-width:2.4}
.stepbox.rel > rect:first-child{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:5 3}
.dia .stepbox,.dia path{transition:opacity .15s}
.dia.focus .stepbox{opacity:.25}.dia.focus path{opacity:.15}
.dia.focus .stepbox.sel,.dia.focus .stepbox.rel{opacity:1}

/* Listen */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start;max-width:1400px}
.blk{display:grid;gap:10px}
.blk h2{font-size:16px;display:flex;gap:8px;align-items:baseline}
.blk h2 .c{font-size:13px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.req{width:100%;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;background:none;border:0;text-align:left;cursor:pointer}
.req:hover{background:var(--sunk)}
.req.sel{background:var(--accent-soft)}
.id{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
.req .t{font-size:14.5px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--off))}
.st.E{--c:var(--ok)}.st.V,.st.F{--c:var(--wait)}.st.O{--c:var(--open)}

.dec{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:11px 14px;align-items:start}
.dec .n{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:2px}
.dec .q{font-size:14.5px}
.r{background:none;border:0;padding:0;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--faint);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.r:hover{color:var(--fg)}
.dec .res{grid-column:2/-1;font-size:13px;color:var(--ok)}
.dec .res.z{color:var(--muted)}
.dec.done .q{color:var(--muted)}

.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.pager a{text-decoration:none;color:var(--muted);font-size:14px;display:grid;gap:2px}
.pager a b{color:var(--fg);font-weight:500}
.pager a.next{text-align:right;margin-left:auto}

/* Übersicht */
.stats{display:flex;flex-wrap:wrap;gap:12px 40px}
.stats div{display:grid}
.stats b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:13px;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stage{display:grid;gap:10px;align-content:start}
.stage .sl{font-size:12.5px;color:var(--muted);padding-bottom:6px;border-bottom:2px solid var(--fg)}
.card{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .15s}
.card:hover{border-color:var(--fg)}
.card .no{font-family:var(--mono);font-size:12px;color:var(--accent)}
.card b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.card p{font-size:13.5px;color:var(--muted)}
.card .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .meta em{font-style:normal;color:var(--open)}
.febs{grid-column:1/-1}
.more{display:flex;flex-wrap:wrap;gap:10px}
.more a{text-decoration:none;color:var(--fg);font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.more a:hover{border-color:var(--fg)}

/* Entscheide-Ansicht */
.dgrp{display:grid;gap:8px}
.dgrp h2{font-size:15px}
.drow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px 14px;padding:12px 14px;align-items:start}
.drow .n{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:3px}
.drow .q{font-size:14.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.drow input{grid-column:2/-1;width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.note{font-size:13px;color:var(--muted)}
#copyout{width:100%;min-height:120px;font:13px/1.5 var(--mono);border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--fg)}

/* Panel */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);z-index:20;background:var(--surface);border-left:1px solid var(--line);
  box-shadow:-18px 0 40px rgba(10,15,25,.12);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer[hidden]{display:none!important}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 12px 22px;border-bottom:1px solid var(--line)}
.dh .pos{font-size:13px;color:var(--muted)}
.dh .btns{display:flex;gap:6px;flex:none}
.dh .dl{display:flex;align-items:center;gap:10px;min-width:0}
.ib.back{white-space:nowrap;flex:none}
.sec[hidden]{display:none!important}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px}
.ib:hover{border-color:var(--fg)}.ib:disabled{opacity:.35;cursor:default}
.db{overflow-y:auto;padding:22px;display:grid;gap:22px;align-content:start;overscroll-behavior:contain}
.dstep{display:grid;gap:4px}
.dstep .who{font-size:13px;color:var(--muted)}
.dstep h2{font-size:20px}
.manual{font-size:13.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--faint);border-radius:8px;padding:10px 12px}
.rq{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.rq .top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.rq h3{font-size:17px}
.rq .orig{font-size:12.5px;color:var(--muted)}
.rq .sec{display:grid;gap:4px}
.rq .sec>span{font-size:12px;color:var(--faint)}
.soll{white-space:pre-line;font-size:14.2px;line-height:1.6}
.offen{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}
.src{font-size:12px;color:var(--faint)}
.also{font-size:13px;color:var(--muted)}


/* Technik im Seitenpanel */
.dtabs{display:inline-flex;gap:4px;background:var(--sunk);border-radius:9px;padding:4px;justify-self:start}
.dtabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;color:var(--muted);font-size:13.5px;cursor:pointer}
.dtabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dtabs button:disabled{opacity:.4;cursor:default}
.tt{display:grid;gap:18px}
.tt .sec{display:grid;gap:6px}
.tt .sec>span{font-size:12px;color:var(--faint)}
.tt .trg{font-size:14.2px;line-height:1.55}
.flowl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.flowl li{display:grid;gap:4px;border-left:2px solid var(--line);padding:2px 0 2px 12px}
.flowl .dir{font-size:12.5px;font-weight:600}
.flowl p{font-size:14px}
.tlist.sm li{grid-template-columns:74px minmax(0,1fr) auto;gap:10px;padding:10px 12px}
.tlist.sm .tb p{font-size:13.5px}
.xl{display:grid;gap:6px}
.xd{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.xd summary{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-size:13.5px;list-style:none}
.xd summary::-webkit-details-marker{display:none}
.xd summary::after{content:"+";margin-left:auto;color:var(--faint);font-family:var(--mono)}
.xd[open] summary::after{content:"–"}
.xd summary code{font-size:12.5px}
.xd summary .sl{font-size:11.5px;color:var(--faint)}
.xd summary .id{font-family:var(--mono);font-size:12px;color:var(--faint)}
.xd summary .sev{margin-left:auto}
.xd .xb{padding:2px 12px 12px;display:grid;gap:8px;font-size:13.5px}
.xd dl{margin:0;display:grid;gap:8px}
.xd dt{font-size:12px;color:var(--faint)}
.xd dd{margin:2px 0 0}
.xd.plain{padding:8px 12px;font-size:13.5px}
.tlink{font-size:13.5px;color:var(--fg)}

/* Status, Verlauf, Kommentare */
.rt{display:inline-flex;align-items:center;gap:10px}
.cc{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums}
.stsel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 6px 3px 9px;background:var(--surface)}
.stsel select{border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:2px 0;cursor:pointer}
.stsel:focus-within{border-color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
.dot.E{background:var(--ok)}.dot.V,.dot.F{background:var(--wait)}.dot.O{background:var(--open)}
.dstep .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who-l{font-size:13px;color:var(--muted)}
.hist{gap:8px}
.hist-list{list-style:none;margin:0;padding:0;display:grid;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);max-height:320px;overflow-y:auto}
.hist-list .hi{padding:9px 12px;display:grid;gap:3px}
.hist-list .hi+.hi{border-top:1px solid var(--line)}
.hist-list .empty{padding:9px 12px;font-size:13px;color:var(--faint)}
.hm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.hm .who{color:var(--fg);font-weight:500}
.hb{font-size:13.5px}
.ctext{white-space:pre-line}
.cbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.cbox textarea{width:100%;resize:vertical;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--fg)}
.cbox textarea:focus{outline:none;border-color:var(--fg)}
.overview-hist .hist-list{max-height:none}
.blk .hist-list{background:var(--surface);max-height:none;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast[hidden]{display:none!important}
.seg button:disabled{cursor:default;opacity:.7}

/* Technik-Ebene */
.mode{display:inline-flex;gap:4px;background:var(--sunk);border-radius:9px;padding:4px;justify-self:start}
.mode a{padding:7px 14px;border-radius:7px;text-decoration:none;color:var(--muted);font-size:14px}
.mode a[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tnote{font-size:14px;color:var(--muted);max-width:75ch}
.tcols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.tgrp{display:grid;gap:8px}
.tgrp+.tgrp{margin-top:14px}
.tgrp h3{font-size:13px;color:var(--muted);font-weight:500}
.tlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tlist li{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;padding:11px 14px;align-items:start}
.tlist li+li{border-top:1px solid var(--line)}
.sys{font-size:11.5px;font-weight:600;padding-top:2px}
.sys.sf{color:var(--sf)}.sys.ap{color:var(--ap)}.sys.mob{color:var(--mm)}.sys.oth{color:var(--mon)}.sys.thor{color:var(--fg)}
.tb{display:grid;gap:5px;min-width:0}
.tb p{font-size:14px}
.tb .warn{font-size:13px;color:var(--open)}
.objs{display:flex;flex-wrap:wrap;gap:5px}
.obj{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px;cursor:pointer;text-align:left}
.obj:hover{color:var(--fg);border-color:var(--fg)}
.obj.plain{cursor:default}
.tw{display:grid;justify-items:end;gap:3px;text-align:right}
.tg{font-size:11.5px;padding:1px 7px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.tg.thor{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tg.h{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 40%,transparent)}
.tg.a{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.who2{font-size:11.5px;color:var(--faint);max-width:150px}
.sev{font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.sev::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--off)}
.sev.H::before{background:var(--open)}.sev.M::before{background:var(--wait)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
.tbl th,.tbl td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:500}
.tbl td:first-child{font-weight:500;width:26%}
.tbl td.muted{color:var(--muted)}
.chg{display:grid;grid-template-columns:110px minmax(0,auto) minmax(0,1fr);gap:4px 14px;padding:11px 14px;align-items:baseline}
.chg .ck{font-size:12px;color:var(--accent)}
.chg code{font-family:var(--mono);font-size:12.5px}
.chg .cd{font-size:13.5px;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.qc .qa{font-size:12px;color:var(--accent);font-weight:600}
.qc b{font-size:14.5px;font-weight:600}
.qc p{font-size:13.5px;color:var(--muted)}
.qc .qf{color:var(--fg)}
.todo{padding:11px 14px;font-size:14px}
code{font-family:var(--mono)}
@media (max-width:1100px){.tcols{grid-template-columns:1fr}.qgrid{grid-template-columns:1fr}}
@media (max-width:620px){.tlist li{grid-template-columns:minmax(0,1fr)}.tw{justify-items:start;text-align:left;grid-auto-flow:column;justify-content:start}.chg{grid-template-columns:1fr}}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;overflow-x:auto;gap:6px;padding:10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  .brand,.side .foot,.navgrp .lab{display:none}
  .navgrp{display:flex;gap:4px}
  .navgrp a{grid-template-columns:auto auto;white-space:nowrap}
  .navgrp a .cnt{display:none}
  .flow{grid-template-columns:1fr 1fr}
  .drawer{top:auto;left:0;width:100%;height:82vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-left:env(safe-area-inset-left,0px)}
}
@media (max-width:520px){.flow{grid-template-columns:1fr}.drow{grid-template-columns:32px minmax(0,1fr)}.drow .seg{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.lang{display:inline-flex;align-self:start;margin:0 8px;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);letter-spacing:.03em}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (max-width:860px){.lang{align-self:center;margin:0 4px 0 0}}

<script>
const SOLL={"SF 1": {"t": "Neukunde ins ERP", "s": "Wenn die Opportunity auf 'Closed Won' steht und der Account noch keine AP-Kundennummer hat, dann legt die Integration Firma, Rechnungsadresse, Ansprechpartner und Lieferadresse (als eigene Adresse) in AP plus an. Die AP-Kundennummer kommt zurück an den Account.\nBestandskunden werden nicht neu angelegt, nur der Auftrag geht nach AP plus. Die Aufgabe 'Prospect soll AP Kunde werden' entfällt als Auslöser.\nOhne Lieferadresse wird nicht übertragen.\nLieferadresse Validierung in Opportunity Closed Won Status.", "q": "", "f": "Salesforce (Stammdaten); AP plus vergibt die Kundennummer", "o": "Wondercode: Mapping Lieferadresse.\nC.M. Heim: Sollen Adressänderungen nach der Erstanlage auch nach AP plus?", "ts": ""}, "SF 2": {"t": "Kunde ins Portal", "s": "Wenn ein MOBS-Account eine AP-Kundennummer erhält, dann wird der Kunde in MyMOBS angelegt. Nur MOBS-Kunden, keine Lieferanten, kein FEBS. Bleibt wie heute.\nBetrifft die Benutzer, nicht den Kunden, siehe Nr. 7.\nAngelegt wird nur die Firma (Kundendatensatz mit Betreiberkennwort), noch kein Benutzer. Den ersten Benutzer (Admin) legt Nr. 7 an; ohne Firma kann kein Benutzer angelegt werden.", "q": "", "f": "Salesforce", "o": "Wondercode/Christian Sill: prüfen, ob heute Lieferanten in MyMOBS landen, und ausschliessen.", "ts": ""}, "SF 3": {"t": "Anlagen", "s": "Wenn eine Anlage in AP plus angelegt, geändert oder ausgebucht wird, dann zeigt Salesforce den aktuellen Stand (nur Anzeige), die MyMOBS-Gerätedatenbank wird nachgeführt und das Data Warehouse führt die Historie.\nSalesforce ändert keine bestehenden Anlagen. Einzige Ausnahme: leere Anlagen-Hüllen anlegen (Nr. 11).\nAnlagendaten werden nur in AP plus gepflegt, Salesforce liest. Damit gibt es keine Überschreibungen.\nSalesforce Objekt : Anlage", "q": "", "f": "AP plus (später Gerätedatenbank)", "o": "C.M. Heim: Wo werden 'letzte Wartung' und 'nächste Wartung' gepflegt? Vorschlag: am Wartungsvertrag in Salesforce (siehe Monday Nr. 3).\nC.M. Heim: Ungenutzte Felder entfernen (Letzte_Wartung_SFC__c, Kaufdatum__c, Heim_Auftrag_Service__c und 9 Gerätefelder)?\nC.M. Heim: Ist C.M. Heim Eigentümer der 1'450 Anlagen im Mietpark?", "ts": ""}, "SF 4": {"t": "Geräte", "s": "Wenn ein Gerät in AP plus erfasst, einer Anlage zugeordnet oder von ihr getrennt wird (Rücklauf), dann ist der Stand in Salesforce sichtbar. Schlüssel ist Artikelnummer + Seriennummer (AP-ID). Die Historie Gerät ↔ Anlage liegt im Data Warehouse.\nKein Abgleich in beide Richtungen. Meldernummer vor Ort gewechselt: wird durch die Update-Übertragung entschärft, sauber lösbar erst mit der Gerätedatenbank.\nSalesforce Architektur muss angepasst werden, da die jetzige Architektur diese Struktur nicht unterstützt.", "q": "", "f": "AP plus", "o": "Wondercode: AP-ID ins Salesforce-Layout.\nC.M. Heim: Wie werden Mietprodukte ohne Seriennummer geführt?", "ts": ""}, "SF 5": {"t": "Gerätedatenbank", "s": "Wenn Anlagen, Seriennummern oder Artikel in AP plus neu sind oder sich ändern, dann sind sie in den MyMOBS-Pool-Tabellen (Poolanlagen, Poolgeräte) und in Salesforce aktuell, inklusive Verschiebungen und Ausbuchungen. Läuft weiter wie heute.", "q": "", "f": "AP plus", "o": "", "ts": ""}, "SF 6": {"t": "Wartungsverträge", "ts": "Abgleich Wartungsverträge mit AP plus", "s": "Entfällt: der Abgleich der Wartungsverträge aus AP plus nach Salesforce. Wartungsverträge (IHV) werden nur noch in Salesforce angelegt und gepflegt, deshalb braucht es den Abgleich nicht mehr. Das Data Warehouse liest die Verträge aus Salesforce.\nWas weiterläuft: der Wartungsvertrag selbst (Nr. 20), Servicelevel und Partner nach MyMOBS (MyMOBS Nr. 3), die Quartalsaufgabe an Monday (Monday Nr. 3).", "q": "", "f": "Salesforce", "o": "Servicelevel und Partner am MyMOBS-Kunden werden weiterhin gebraucht (bestätigt 23.11.2026), Übertragung siehe MyMOBS Nr. 3."}, "SF 7": {"t": "Portal-Benutzer", "s": "Richtung ist Salesforce → MyMOBS (nicht umgekehrt).\n\n1. Der Kunde meldet über das MyMOBS-Verbindungsmerkblatt (PDF) die Benutzer, die zuerst angelegt werden sollen. Das Blatt geht an Julian.\n2. Julian trägt den Kontakt in Salesforce im Account-Feld „MyMOBS Admin“ ein.\n3. Die Integration legt den Kontakt als Admin in MyMOBS an und schickt ihm die Zugangsdaten mit Passwort per E-Mail (Brevo).\n4. Weitere Benutzer legt der Admin des Kunden selbst in MyMOBS an.\n\nBleibt so bis MyMOBS V2. Julian nutzt die Funktion laufend für das Order Management.\n→ BPMN 02\nSollte gelöst werden via Account Teams, um einen Überblick über alle Admins zu haben.\nVoraussetzung: Die Firma ist in MyMOBS bereits angelegt (Nr. 2).", "q": "", "f": "MyMOBS (Benutzer); Salesforce nur Auslöser für den ersten Admin", "o": "Voraussetzung: Der Admin hat die Schulung gemacht (Confluence). Eingetragen wird durch Julian.\nBekannte Schwächen: nur Admin-Rolle, ersetzter Admin bleibt aktiv (siehe MyMOBS 'Offboarding').", "ts": ""}, "SF 8": {"t": "Rücksendungen", "s": "Ziel: Jede Rücksendung startet in Salesforce. AP plus bucht sie, danach kennt Salesforce das Ergebnis. Es gibt zwei Fälle.\n\nA) Mietende (ganz oder teilweise)\n\n1. Der Kunde kündigt die Rückgabe an.\n2. Inside Sales legt im Vertrag einen Auftrag „Miete zurück“ an und wählt die Anlagen oder einzelnen Teile, die zurückkommen.\n3. Salesforce legt die Rücksendung in AP plus an: Kunde, Vertrag und je Anlage Artikel und Menge, ohne Seriennummern. Die RMA-Nummer kommt zurück nach Salesforce.\n4. Die Ware kommt an. Die Logistik prüft physisch, scannt die Seriennummern und bucht in AP plus.\n5. AP plus meldet an Salesforce die gebuchten Mengen, die Seriennummern und den Status. Die Anlagen sind ausgebucht, fehlende Teile sind sichtbar.\n6. Danach folgt „Vertrag anpassen“ (Nr. 17), bei Teilrückgabe Nr. 18.\n\nB) Defekt oder Wartung im Werk (einzelne Geräte)\n\n1. Der Kunde meldet einen Defekt, es entsteht ein Kundenvorgang.\n2. Der Service legt im Kundenvorgang die RMA an und wählt das Gerät über die AP-ID (Artikel + Seriennummer). Bei Wartung im Werk ist wählbar, ob die ganze Anlage oder einzelne Geräte kommen (Idee Heike).\n3. Salesforce legt die Rücksendung mit Seriennummer in AP plus an.\n4. AP plus bucht. Salesforce erhält den Status, und der Service bekommt die Aufgabe „Rücksendung gebucht“ und legt Opportunity und Angebot an (Reparatur oder Neugerät).\n5. Der Vertrag bleibt unverändert.\n\nFällt weg: leere Köpfe aus der Opportunity, Rücksendungen nur in AP plus und der Begleitschein per Mail.", "q": "", "f": "Salesforce (Auslösung, erwartete Menge); AP plus (Buchung, Seriennummern)", "o": "Voraussetzung: Vertrag kennt Auftrag und Anlagen (neue Zeile 'Verknüpfung').\nIdee Heike (Aufgabe bei 'Wartung im Werk'): bei b) wählbar machen, ob ganze Anlage oder einzelne Geräte kommen.\nTeilrückgabe: siehe neue Zeile.\nRollenwechsel bestätigen: Heute legt das Order Management die RMA an (Confluence). Im Soll legt Inside Sales sie aus dem Vertrag an (Fall A), der Service aus dem Kundenvorgang (Fall B).\nUnangekündigte Rücksendungen: in Workshop und Confluence nicht festgelegt. Ziel aus dem Workshop: alles kommt an einer Stelle an, wird erfasst und weitergeleitet.\nC.M. Heim: Bleibt das interne Monday-Board 'Miete zurück' bestehen? Welche Wertgrenze gilt bei Schäden (Confluence: 'xy €')? Wo wird die SIM deaktiviert?\nC.M. Heim: Neue Auftragsart „Miete zurück“ einführen? Heute gibt es sie in Salesforce nicht.", "ts": ""}, "SF 9": {"t": "Produktionsauftrag & Mietauftrag", "s": "Ziel: Das Order Management arbeitet nur in Salesforce. Der Auftrag kommt in AP plus bereits auf Anlagen aufgeteilt an, die Aufteilung von Hand in AP plus entfällt.\n\n1. Ein Kauf- oder Mietauftrag ist angelegt (Status „Wird überprüft“).\n2. Das Order Management wählt am Auftrag 'Anlagen anlegen' und gibt Anzahl, Bezeichnung, Eigentümer und Betreiber an. Die Integration legt in AP plus sofort die Anlagen als leere Hüllen an. Die ANL-Nummern kommen zurück an die Anlagen in Salesforce (Details Nr. 11).\n3. Das Order Management ordnet in Salesforce jeder Anlage Artikel und Menge nach MOBS-Kalkulator zu.\n4. Der Technische Support gibt den Auftrag frei. Das ersetzt die heutige Aufgabe als Auslöser.\n5. Die Integration legt den Auftrag mit Positionen in AP plus an. Die Positionen sind den Anlagen zugeordnet, bei Miete kommt je Anlage die Position „Mietkonfiguration“ dazu. Die Lieferadresse wird korrekt übertragen.\n6. Die AP-Auftragsnummer kommt zurück an den Auftrag in Salesforce.\n7. Die Produktion arbeitet in AP plus wie gewohnt und ordnet den Anlagen die Seriennummern zu. Diese kommen zurück nach Salesforce (Nr. 3 und 4).\n\nDer Kunde sieht in der Auftragsbestätigung weiterhin Stückzahlen. Nach AP plus gehen nur Auftragsarten mit Produktion.", "q": "", "f": "Salesforce (Auftrag); AP plus (Produktion)", "o": "Wondercode: Lieferadresse korrekt übertragen (heute fehlerhaft).\nAbhängig von Nr. 11.", "ts": ""}, "SF 10": {"t": "Warenausgang Wartungsmaterial", "s": "Ziel: Der Warenausgang für das Wartungsmaterial wird aus dem Wartungsvertrag in Salesforce ausgelöst, nicht aus Monday.\n\n1. Im Wartungsvertrag wird die Wartung für das Quartal an Monday übergeben (Monday Nr. 3).\n2. Im selben Schritt wird der Warenausgang für Batterien und Akkus ausgelöst. Menge = Anzahl Melder im Vertrag x 2, anpassbar.\n3. Die Integration legt den Warenausgang mit Positionen und Lieferadresse in AP plus an.\n4. Die Logistik verschickt aus AP plus, der Bestand stimmt.\n\nIm Wartungsvertrag steht nur das Quartal; den konkreten Termin vereinbart ihr in Monday mit dem Partner.", "q": "", "f": "Salesforce (Auslöser, Wartungsvertrag); AP plus (Warenausgang, Bestand)", "o": "C.M. Heim: Freigabe des Ablaufs; Ergebnis der internen Initiative (Heike) berücksichtigen.\nVoraussetzung: Wartungsvertrag kennt seine Anlagen (Nr. 16), sonst ist die Menge nicht berechenbar.", "ts": ""}, "SF 11": {"t": "Anlage anlegen", "s": "Ziel: Das Order Management teilt einen Auftrag in Salesforce auf Anlagen auf und braucht dafür keine AP-plus-Lizenz mehr.\n\nBeispiel: Verkauft sind 32 Melder. Laut MOBS-Kalkulator der Planung sind das 4 Anlagen mit je 8 Meldern.\n\n1. Bevor der Kauf- oder Mietauftrag zur Produktion freigegeben wird, wählt das Order Management am Auftrag in Salesforce 'Anlagen anlegen' und gibt die Anzahl Anlagen an (im Beispiel 4), dazu Bezeichnung, Eigentümer und Betreiber.\n2. Die Integration legt in AP plus entsprechend viele leere Anlagen (Hüllen) an. Die Anlagennummern kommen zurück nach Salesforce, die Anlagen hängen am Auftrag.\n3. Das Order Management ordnet in Salesforce jeder Anlage Artikel und Menge zu, z. B. Anlage 1: 8 Melder Artikel X, 1 Zentrale Artikel Y. Grundlage ist der MOBS-Kalkulator; eine automatische Aufteilungsregel gibt es nicht.\n4. Mit der Produktionsfreigabe geht der Auftrag mit den Positionen je Anlage nach AP plus (Nr. 9).\n5. Die Produktion ordnet in AP plus wie gewohnt die Seriennummern den Anlagen zu. Diese kommen zurück nach Salesforce (Nr. 3, 4).\n\nDer Kunde sieht im Angebot und in der Auftragsbestätigung weiterhin Stückzahlen (32 Melder), nicht die Aufteilung.\nSalesforce legt nur die Hüllen an und ändert danach keine bestehenden Anlagen (Nr. 3).", "q": "", "f": "Salesforce (Planung der Anlagen); AP plus (Anlagennummer, Seriennummern, Ist-Zustand)", "o": "C.M. Heim: Wird diese Lösung als Übergang bis zur Gerätedatenbank gebaut? (im Workshop offen gelassen)\nC.M. Heim: Welche Felder braucht die Hülle in AP plus (Status, Mietkonfiguration je Anlage, Disposition, Warenausgang)?\nWondercode: Verknüpfung Auftrag ↔ Anlage im bestehenden Anlagen-Objekt umsetzen (siehe Nr. 16).", "ts": ""}, "SF 12": {"t": "KV Tauschmelder versenden", "s": "Zurückgestellt: C.M. Heim setzt den Tauschprozess ab Dezember intern neu auf und gibt ihn danach an Wondercode.\n\nHeute: Kundenvorgang → Opportunity/Angebot Tauschgerät → AP-Auftrag → Versand → RMA defektes Gerät → Angebot/Auftrag Reparatur → Lieferung → zweite RMA für das Tauschgerät. Eine Person in 3–4 Systemen, Kosten höher als Ertrag.\n\nFür die Integration relevant bleibt voraussichtlich nur: Der Auftrag geht von Salesforce nach AP plus (wie Kauf/Miete).\nEine Anfrage direkt in MyMOBS ist nicht im Umfang (keine Weiterentwicklung in MyMOBS, siehe MyMOBS Nr. 7).\nAuslöser ist heute der Kundenvorgang in Salesforce (Anruf beim Technischen Support).", "q": "", "f": "Salesforce (Kundenvorgang, Auftrag); AP plus (Produktion, Versand, RMA)", "o": "C.M. Heim: neuen Tauschprozess an Wondercode geben.", "ts": ""}, "SF 13": {"t": "NSL Vertragsdaten von PST", "s": "Wenn die monatliche PST-Rechnung (PDF) Meldungen für einen Kunden zeigt, dann wird weiterverrechnet: laut Confluence durch den Einkauf ab 5 Meldungen (neue Angebotsgruppe, Kundenvorgang, Auftrag anpassen, Rechnung).\nKeine Automatik geplant, weil die Quelle ein PDF ist.", "q": "", "f": "AP plus (Eingangsrechnung); Salesforce (Weiterverrechnung)", "o": "C.M. Heim: Regel bestätigen. Workshop: Buchhaltung, je Anruf; Confluence: Einkauf, ab 5 Meldungen.\nC.M. Heim: Beispiel-Rechnung von PST senden.", "ts": ""}, "SF 14": {"t": "Lead aus Website", "s": "Wenn das Kontaktformular auf der Website abgeschickt wird, dann liegt der Lead (MOBS oder FEBS) in Salesforce. Läuft heute per Webhook und bleibt so.", "q": "", "f": "Salesforce", "o": "", "ts": ""}, "SF 15": {"t": "Auftragsart steuert das Ziel", "s": "Wenn ein Auftrag vom Status 'Wird überprüft' durch den Technischen Support freigegeben wird, dann bestimmt die Auftragsart das Ziel:\n- Kauf, Miete (Produktion) → AP plus\n- Montage, Demontage, IBN, Planung, Hubarbeitsbühne, Entstörung, Schulung → Aufgabe an Monday (Partner)\n- IHV, Wartung → Wartungsvertrag in Salesforce\n- Miete zurück → Rücksendung (Nr. 8)\n- NSL → Nr. 13", "q": "", "f": "Salesforce (Auftrag, Auftragsart)", "o": "C.M. Heim: Liste der 13 Auftragsarten mit Zielsystem bestätigen (inkl. Tausch, Service).\nC.M. Heim: Auslöser der Freigabe festlegen: Welcher Status oder welches Feld am Auftrag bedeutet 'freigegeben'? In den Quellen gibt es zwischen 'Wird überprüft' und 'geliefert' keinen benannten Status. Heute löst eine Aufgabe an den Technischen Support aus, die künftig entfällt.\nWiderspruch zu Monday Nr. 2: Hier geht die Aufgabe mit der Freigabe automatisch an Monday, dort per Button mit Partnerwahl. Welche Variante gilt?", "ts": ""}, "SF 16": {"t": "Verknüpfung Auftrag, Anlage, Vertrag", "s": "Ziel: In Salesforce sind Auftrag, Anlagen und Miete miteinander verbunden. Zu jeder Miete sieht man, welche Anlagen und Seriennummern noch beim Kunden sind.\n\nBeispiel: Kunde mietet 100 Melder, aufgeteilt auf 4 Anlagen à 25. Heute steht im Vertrag nur \"100 Melder Miete\". Welche Anlagen und Seriennummern dazugehören, weiss niemand ohne Suchen.\n\n1. Das Order Management legt die Anlagen am Auftrag an (Nr. 11). Auftrag und Anlagen sind damit verbunden.\n2. Ist ein Mietauftrag geliefert, entsteht ein Vertrag über die vereinbarte Mietzeit. Ist danach noch nicht alles zurück, entsteht jeden Monat ein neuer Vertrag für einen Monat, bis alles zurück ist. Die Anlagen hängen deshalb am Auftrag und an der Miete, nicht an einem einzelnen Vertrag. Noch beim Kunden sind: die Anlagen des Auftrags minus die gebuchten Rückgaben.\n3. Die Seriennummern kommen wie heute aus AP plus an die Anlagen (Nr. 3, 4).\n4. Beim Wartungsvertrag (IHV) werden die Anlagen zugeordnet, die gewartet werden.\n\nWird gebraucht für: Rücksendung aus dem Vertrag (Nr. 8), Vertrag anpassen nach Rückgabe, Wartungsmaterial (Nr. 10), Prüfliste je Quartal und das Data Warehouse (Seriennummer ↔ Vertrag).", "q": "", "f": "Salesforce (Verknüpfung); AP plus (Anlagen, Seriennummern)", "o": "Wondercode: Datenmodell Auftrag–Anlage–Miete vorschlagen (Vorschlag Technik: erste Opportunity als Mietschlüssel, Anlage ↔ Auftrag).\nC.M. Heim: Vertrag automatisch erstellen und aktivieren, oder wie heute von Hand durch das Order Management?\nWondercode + C.M. Heim: Welche Automatisierungen in Salesforce werden für die Verknüpfung Auftrag – Anlage – Vertrag benötigt?\nC.M. Heim: Verträge weiter aus der Opportunity erstellen und die erste Opportunity als Mietschlüssel nutzen (Vorschlag Technik)?", "ts": ""}, "SF 17": {"t": "Vertrag anpassen nach Rückgabe", "s": "Ziel: Nach einer gebuchten Miet-Rücksendung wird die nächste Monatsverlängerung automatisch mit der Restmenge erstellt. Die Buchhaltung muss nichts mehr von Hand abgleichen.\n\nRegel (entschieden am 25.11.2026):\n- Rückgabe während der vereinbarten Mietzeit: Der Vertrag bleibt bis zum Ende der Mietzeit unverändert. Die Rückgabe wirkt ab der ersten Monatsverlängerung.\n- Rückgabe während der monatlichen Verlängerung: Der laufende Monat bleibt unverändert. Die Rückgabe wirkt ab der nächsten Monatsverlängerung.\n\nBeispiel: Kunde mietet 100 Melder auf 4 Anlagen und schickt Anlage 2 (25 Melder) zurück. Der laufende Vertrag bleibt bei 100 Meldern, die nächste Verlängerung enthält 75.\n\n1. Die Logistik bucht die Rücksendung in AP plus mit Seriennummern (Nr. 8).\n2. AP plus meldet an Salesforce, welche Anlagen, Mengen und Seriennummern zurück sind.\n3. Salesforce vergleicht mit der erwarteten Menge aus der Rücksendung (Soll/Ist).\n4. Die nächste Monatsverlängerung wird mit der Restmenge erstellt. Sind alle Anlagen zurück, entsteht keine weitere Verlängerung, die Miete endet.\n5. Inside Sales erhält eine Aufgabe 'Vertrag prüfen' mit dem Soll/Ist-Vergleich und bestätigt. Fehlen Teile (z. B. 28 statt 30), ist das sichtbar und Inside Sales klärt es mit dem Kunden.\n\nRücksendungen ohne Vertragsbezug (Defekt, Reparatur) ändern den Vertrag nicht.\nFällt weg: Begleitschein per Mail, manueller Abgleich durch die Buchhaltung.", "q": "", "f": "Salesforce (Vertrag)", "o": "Wondercode: Umsetzung über Rücksendezeilen und die Verlängerungsmenge in CPQ (Technik-Landkarte B4, B16).", "ts": ""}, "SF 18": {"t": "Teilrückgabe Miete", "s": "Ziel: Gibt der Kunde nur einen Teil seiner Mietanlagen zurück, läuft die Miete mit der restlichen Menge weiter, und Salesforce zeigt jederzeit, was noch beim Kunden ist.\n\nA) Geplante Teilrückgabe (Kunde gibt bewusst nur einen Teil zurück, z. B. \"Anlage grün\")\n1. Der Kunde kündigt die Rückgabe an. Inside Sales klärt mit ihm, welche Anlagen oder Teile zurückkommen.\n2. Inside Sales legt im Vertrag einen Auftrag \"Miete zurück\" an und wählt nur diese Anlagen oder Teile (Nr. 8).\n3. Salesforce legt die Rücksendung in AP plus an: je gewählter Anlage Artikel und Menge, ohne Seriennummern.\n4. Die Logistik prüft physisch, scannt die Seriennummern und bucht in AP plus.\n5. AP plus meldet die gebuchten Mengen und Seriennummern an Salesforce. Salesforce vergleicht mit der erwarteten Menge (Soll/Ist, Nr. 17).\n6. Die zurückgegebenen Anlagen sind ausgebucht. Die nächste Monatsverlängerung enthält nur noch die übrigen Anlagen (Regel siehe Nr. 17).\n7. Inside Sales erhält die Aufgabe \"Vertrag prüfen\" und bestätigt.\n\nB) Ungeplante Fehlmenge (es kommt weniger zurück als angekündigt, z. B. 28 statt 30)\n1. Die Logistik bucht nur die tatsächlich angekommene Menge.\n2. Der Soll/Ist-Vergleich zeigt die Fehlmenge. Was nicht angekommen ist, bleibt in der Miete.\n3. Inside Sales klärt die fehlenden Teile mit dem Kunden.\n\nFällt weg: Begleitschein per Mail und Abgleich durch die Buchhaltung.\nVoraussetzung: Die Miete kennt ihre Anlagen (Nr. 16).\n→ BPMN 09", "q": "Workshop Teil 1, ca. 01:18–01:30 und 02:55–02:58; Confluence \"Miete zurück\" (dort nur Vollrückgabe beschrieben)", "f": "Salesforce", "o": "C.M. Heim: Fehlmenge – wie heute eine neue RMA für den Rest anlegen, oder reicht der Soll/Ist-Vergleich mit Aufgabe an Inside Sales?", "ts": ""}, "SF 19": {"t": "Rechnungen ins Data Warehouse (JustOn)", "s": "Wenn in JustOn eine Rechnung, Zahlung oder Mahnung entsteht, dann sind Rechnungen, Zahlungen und offene Posten MOBS im Data Warehouse.\nDie Rechnung wird durch den Status 'geliefert' am Auftrag ausgelöst. Die wöchentliche Übergabe JustOn → Datev (Steuerkanzlei) bleibt wie heute.\nIm Workshop nicht besprochen, aus Confluence.", "q": "", "f": "JustOn (Salesforce)", "o": "C.M. Heim: Sollen JustOn und Datev Quellen des Data Warehouse werden?", "ts": ""}, "AP 1": {"t": "Neukunde ins ERP", "s": "Siehe Salesforce Nr. 1. Wenn die Opportunity auf 'Closed Won' steht und der Kunde noch keine AP-Kundennummer hat, dann wird er mit Lieferadresse als eigener Adresse in AP plus angelegt. Die Kundennummer vergibt AP plus.\n→ BPMN 01", "q": "Workshop Teil 1, ca. 14:05–20:30 und 02:52:58", "f": "Salesforce (Stammdaten); AP plus (Kundennummer)", "o": "", "ts": ""}, "AP 2": {"t": "Anlagen", "s": "Wenn eine Anlage in AP plus angelegt, geändert oder ausgebucht wird, dann zeigt Salesforce den aktuellen Stand. Richtung AP plus → Salesforce (nicht umgekehrt).\nEinzige Richtung Salesforce → AP plus: leere Anlagen-Hüllen anlegen (Salesforce Nr. 11), keine Änderungen an bestehenden Anlagen.\n→ BPMN 05", "q": "Workshop Teil 1, ca. 25:00–39:00 und 02:52:58; Teil 2, ca. 03:20–04:10", "f": "AP plus", "o": "Siehe Salesforce Nr. 3 und 11.", "ts": ""}, "AP 3": {"t": "Geräte", "s": "Siehe Salesforce Nr. 4. Wenn ein Gerät in AP plus erfasst, zugeordnet oder getrennt wird, dann ist der Stand in Salesforce sichtbar. Schlüssel: Artikelnummer + Seriennummer (AP-ID).\n→ BPMN 05", "q": "Workshop Teil 1, ca. 25:00–39:00 und 01:50:46", "f": "AP plus", "o": "", "ts": ""}, "AP 4": {"t": "Gerätedatenbank", "s": "Siehe Salesforce Nr. 5. Anlagen, Seriennummern und Artikel gehen nach MyMOBS (Pool-Tabellen) und Salesforce, inklusive Änderungen.\n→ BPMN 05", "q": "Workshop Teil 3, ca. 13:00–20:40", "f": "AP plus", "o": "", "ts": ""}, "AP 5": {"t": "Wartungsverträge", "s": "Wartungsverträge werden nur noch in Salesforce angelegt und gepflegt. Der Abgleich mit AP plus entfällt.\n→ BPMN 07", "q": "Workshop Teil 1, ca. 39:13 und 02:53:32", "f": "Salesforce", "o": "", "ts": "Abgleich Wartungsverträge mit AP plus"}, "AP 6": {"t": "Rücksendungen", "s": "Wenn eine Rücksendung in AP plus mit Seriennummern gebucht wird, dann sind Status, gebuchte Mengen und Seriennummern in Salesforce sichtbar, die Anlagen sind ausgebucht und die Historie liegt im Data Warehouse. Bei Defekt erhält der Service eine Aufgabe 'Rücksendung gebucht'.\nAngelegt wird die Rücksendung in Salesforce (Salesforce Nr. 8). Euer Wunsch aus Bemerkung N (aus dem Vertrag auf Anlagenebene) ist genau das Zielbild.\nDer Begleitschein per Mail an Invoice entfällt dann.\n→ BPMN 09, 10", "q": "Workshop Teil 1, ca. 01:21–01:52 und 02:55–02:58", "f": "Salesforce (Auslösung); AP plus (Buchung, Seriennummern)", "o": "Voraussetzung: Verknüpfung Auftrag–Anlage–Vertrag (Salesforce, neue Zeile).", "ts": ""}, "AP 7": {"t": "Produktionsauftrag", "s": "Siehe Salesforce Nr. 9. Wenn ein Kauf- oder Mietauftrag freigegeben ist, dann steht er mit Positionen in AP plus.\nAP plus Nr. 7 und Salesforce Nr. 9 sind derselbe Ablauf. Zusätzlich hängt er an Salesforce Nr. 11: Kommen die Anlagen-Hüllen aus Salesforce, entfällt die Aufteilung in AP plus.\n→ BPMN 04", "q": "Workshop Teil 1, ca. 01:00–01:16 und 02:53:32", "f": "Salesforce (Auftrag); AP plus (Produktion)", "o": "", "ts": ""}, "AP 8": {"t": "Neuer Artikel", "s": "Wenn ein Produktions- oder Ersatzteilartikel in AP plus angelegt wird (mit Stückliste), dann steht er in Salesforce mit dem Feld 'To be checked' und in der MyMOBS-Gerätedatenbank.\nMietartikel (Präfix 'M', für CPQ/Subscriptions) werden in Salesforce aus dem Verkaufsartikel abgeleitet. Dienstleistungsartikel gibt es nur in Salesforce.\nArtikel in Salesforce = Verkaufs-, Miet- und Dienstleistungsartikel für CPQ. Ausgelöst aus AP plus, weil dort die Produktionsartikel entstehen.\n→ BPMN 03", "q": "Workshop Teil 1, ca. 02:16–02:28; Teil 2, ca. 00:00–00:38", "f": "AP plus (Produktionsartikel); Salesforce (Miet- und Dienstleistungsartikel)", "o": "Viktor: Gibt es ein Miet-Kennzeichen oder eine Artikelgruppe in der View? Sonst Mietartikel von Hand ableiten.\nWondercode: Reicht 'To be checked'?", "ts": ""}, "AP 9": {"t": "Rücksendung von Miet-Anlagen", "s": "Ersetzt durch Salesforce Nr. 8: Die Rücksendung wird nicht bei Lieferung angelegt, sondern wenn der Kunde die Rückgabe ankündigt, aus dem Vertrag auf Anlagenebene (Artikel und Menge je Anlage, ohne Seriennummern).\nAutomatisierungen innerhalb von AP plus sind nicht Teil des Projekts.\nRücksende-Positionen werden im Zielbild aus Vertrag und Anlagen erzeugt.\n→ BPMN 09", "q": "Workshop Teil 1, ca. 02:54:10–02:55:45", "f": "Salesforce (Auslösung); AP plus (Buchung)", "o": "", "ts": "Rücksendung bei Lieferung anlegen (ersetzt durch SF 8)"}, "AP 10": {"t": "Serviceauftrag", "s": "Wenn eine Rücksendung gebucht ist, dann erhält Salesforce den Status und der Service eine Aufgabe (läuft heute, bleibt).\nDen Serviceauftrag in AP plus legt die AV weiterhin von Hand an: Automatisierung innerhalb von AP plus ist nicht Teil des Projekts.\nDie Info wird gebraucht, weil der Service in Salesforce daraus das Angebot (Reparatur/Neugerät) weiterführt.\n→ BPMN 10", "q": "Workshop Teil 2, ca. 00:49; Teil 1, ca. 01:36–01:39", "f": "AP plus (Buchung)", "o": "Info an Salesforce: bleibt (siehe Nr. 6). Serviceauftrag: nicht im Umfang.", "ts": ""}, "AP 11": {"t": "Dokumente abgreifen", "s": "Wenn ein Dokument (PDF) in AP plus abgelegt wird, dann ist es im Data Warehouse verfügbar, über die AP-plus-API (Mail vom 21.10.2026).\nDokumente aus SharePoint gehören zu Phase 2 (KI über Langdock).\n→ Weitere Quellen", "q": "Workshop Teil 2, ca. 00:59–02:31", "f": "AP plus", "o": "Wondercode: API prüfen.\nC.M. Heim: Welche Dokumentarten genau?", "ts": ""}, "AP 12": {"t": "Fertigungskostenes eines Produkts", "s": "Wenn der Jahresstand der Stückkosten (INV-Preis) freigegeben ist (z. B. im Dezember für das Folgejahr), dann stehen die Stückkosten im Data Warehouse und im Preisbuch des Folgejahres in Salesforce (für Marge und Provision).\nEin stabiler Jahreswert statt laufender Anpassung. Die heutigen Schätzwerte in Salesforce entfallen.\n→ BPMN 03", "q": "Workshop Teil 1, ca. 02:29–02:34; Teil 2, ca. 02:41–03:13", "f": "AP plus", "o": "C.M. Heim: Stichtag, Freigabe und Berechnungsbasis festlegen.\nWondercode: Ist der INV-Preis in den Views verfügbar?", "ts": ""}, "AP 13": {"t": "Lieferstatus an Salesforce", "s": "Wenn der Warenausgang in AP plus gebucht ist, dann steht der Auftrag in Salesforce auf 'geliefert'. Das löst die Rechnung (JustOn) aus.\nDas Order Management setzt den Status nicht mehr von Hand.\n→ BPMN 04", "q": "Workshop Teil 1, ca. 01:15:32–01:16:08; Confluence 'Auftragabwicklung'", "f": "AP plus", "o": "C.M. Heim: Freigabe. Darf 'geliefert' die Rechnung automatisch auslösen?", "ts": ""}, "AP 14": {"t": "Zugriff auf AP plus", "s": "Die Integration liest AP plus über die Views (ANP_CMH_THOR_*) und schreibt nur über die Übergabetabellen (_RW), wie heute bei THOR. AP plus selbst wird nicht umkonfiguriert.\n→ alle", "q": "Workshop Teil 2, ca. 04:16–04:36; THOR-Analyse", "f": "AP plus", "o": "Wondercode: fehlende Felder (Miet-Kennzeichen, INV-Preis, Updates Anlagen) gesammelt bei Viktor anfragen.", "ts": ""}, "KWP 1": {"t": "Neukunde ERP", "s": "Ziel: Alle FEBS-Kunden aus KWP sind im Data Warehouse und dort mit den Kunden aus Salesforce, AP plus und MyMOBS zusammengeführt.\n\n1. FEBS legt den Kunden in der KWP-Adressverwaltung an (von Hand, wie heute).\n2. Die Integration liest den Kunden aus der KWP-Datenbank ins Data Warehouse. Zugriff über die Datenbank wie bei AP plus (gleicher Server).\n3. Das Data Warehouse gleicht ihn mit bestehenden Kunden ab und ergänzt sie: ein Kunde mit AP-Kundennummer, Salesforce-ID und KWP-Nummer.\n4. Gibt es den Account in Salesforce noch nicht, wird er dort angelegt (keine Dubletten).\n\nFelder laut Workshop: Anrede, Name, Vorname, Adresse, Telefon, USt-ID, Debitorennummer, Zahlungskonditionen. Stundenerfassung und Mitarbeiter sind nicht relevant.\nKWP startet am 01.01.2027, bis dahin läuft Streit parallel.\n→ BPMN 12", "q": "Workshop Teil 3, ca. 38:00–59:00 und 02:11–02:18", "f": "KWP", "o": "C.M. Heim (FEBS): Beispieldatensätze oder Screenshots und Feldliste senden.\nC.M. Heim (IT): Zugang zur KWP-Datenbank.\nC.M. Heim: Schritt 4 bestätigen (im Gespräch mit Mark als Vorschlag genannt).\nWiderspruch zu Nr. 4: Dort steht 'Accounts und Kontakte ohne Integration' (Gespräch mit Mark). Schritt 4 hier legt fehlende Accounts in Salesforce an. Was gilt?", "ts": ""}, "KWP 2": {"t": "Kontakt ins ERP", "s": "Wenn in KWP ein Ansprechpartner angelegt wird, dann ist er im Data Warehouse und wird mit bestehenden Kontakten abgeglichen (wie Nr. 1).\n→ BPMN 12", "q": "Workshop Teil 3, ca. 42:00–43:00 (Adressverwaltung); Kundenerfassung KWP Nr. 2", "f": "KWP", "o": "", "ts": ""}, "KWP 3": {"t": "Umsätze ins Data Warehouse", "s": "Ziel: Das Umsatz-Reporting der Heim-Gruppe läuft über das Data Warehouse. Mark erhält Zugriff, Wondercode baut das Dashboard darauf.\n\n1. FEBS schreibt Rechnungen in KWP.\n2. Umsatz, offene Posten und Salden je Kunde kommen ins Data Warehouse.\n3. Ebenso Projekte, Angebote, Aufträge und Wartungsaufträge. Zuerst breit übernehmen, danach gemeinsam festlegen, wie tief in die Projekte gegangen wird.\n→ BPMN 12", "q": "Workshop Teil 3, ca. 45:20–46:50, 54:30–59:00 und 01:00:00", "f": "KWP", "o": "C.M. Heim (FEBS): relevante Felder benennen.", "ts": ""}, "KWP 4": {"t": "Lead aus SF nach KWP", "s": "Leads werden nicht von Salesforce nach KWP übertragen (FEBS-Wunsch, keine Vermischung; Accounts und Kontakte ohne Integration, im Gespräch mit Mark bestätigt).\nLead und Opportunity bleiben in Salesforce. Die Verbindung zu KWP entsteht über das KWP-Angebot an der Opportunity (KWP Nr. 5).\nDie Lead-Herkunft für die Provision ergibt sich aus dem Opportunity-Owner.", "q": "Workshop Teil 3, ca. 43:00–50:40 und 02:05–02:18", "f": "Salesforce (Lead, Opportunity); KWP (Projekt)", "o": "C.M. Heim (FEBS): Ist die Lead-Herkunft für die Provision über den Opportunity-Owner in Ordnung?\nWiderspruch zu Nr. 1, Schritt 4 (Account in Salesforce anlegen). Was gilt?", "ts": "Keine Lead-Übertragung nach KWP"}, "KWP 5": {"t": "FEBS-Angebote an Opportunity", "s": "Ziel: In Salesforce ist die ganze Pipeline der Heim-Gruppe sichtbar (MOBS und FEBS). KWP bleibt führend für FEBS-Angebote, -Aufträge und -Rechnungen.\n\n1. Der Vertrieb legt die FEBS-Opportunity in Salesforce an (wie bisher bei Streit).\n2. FEBS erstellt Angebot, Auftrag und Rechnung nur in KWP (eigene Nummernkreise).\n3. Angebot, Auftrag und Rechnung werden lesend nach Salesforce gespiegelt und mit der Opportunity verknüpft (KWP-Angebotsnummer, Positionen als Text, Betrag).\n4. Die Opportunity ist abgeschlossen, wenn die Rechnung in KWP geschrieben ist.\n\nDie FEBS-Struktur in Salesforce (eigene Objekte, FEBS-App) besteht bereits.\n→ BPMN 12", "q": "Workshop Teil 3, ca. 02:05–02:17 (mit Mark)", "f": "KWP (Angebot, Auftrag, Rechnung); Salesforce (Opportunity)", "o": "Wondercode + FEBS: Wie wird das KWP-Angebot mit der Opportunity verknüpft (Referenz in KWP)?\nWas passiert bei einem KWP-Angebot ohne Opportunity?", "ts": ""}, "KWP 6": {"t": "KWP-Artikel in CPQ", "s": "FEBS-Sicht: FEBS-Angebote entstehen nur in KWP.\nKWP-Angebote werden an die Opportunity gespiegelt (Nr. 5), die Artikel dort nur als Text bzw. Position.\nFür FEBS-Angebote reicht die Spiegelung als Text und Betrag (Nr. 5), es werden keine KWP-Artikel nach Salesforce synchronisiert.\n→ BPMN 03", "q": "Workshop Teil 1, ca. 02:20; Teil 3, ca. 01:05–01:06 und 02:09–02:10", "f": "KWP", "o": "C.M. Heim: Werden KWP-Artikel in CPQ gebraucht, oder reicht die Spiegelung der KWP-Angebote (Nr. 5)?", "ts": ""}, "MM 1": {"t": "Kunde ins Portal", "s": "Siehe Salesforce Nr. 2. Wenn ein MOBS-Account in Salesforce eine AP-Kundennummer erhält, dann wird der Kunde in MyMOBS angelegt. Bleibt so.\nLieferanten gibt es in Salesforce nicht; trotzdem prüfen, ob welche in MyMOBS ankommen.\n→ BPMN 01", "q": "Workshop Teil 3, ca. 01:36–09:10; Teil 1, ca. 20:30–21:30", "f": "Salesforce", "o": "Wondercode/Christian Sill: prüfen, ob Lieferanten in MyMOBS landen.", "ts": ""}, "MM 2": {"t": "Gerätedatenbank", "s": "Siehe Salesforce Nr. 5. Der THOR-Job 'Gerätedatenbank' überträgt Anlagen aus AP plus in 'Poolanlagen', Seriennummern in 'Poolgeräte' sowie die Artikel (Produkte, Ablaufprodukte, Optionen). Die Pool-Tabellen liegen in der MyMOBS-Datenbank, getrennt von MyMOBS Live. Der Job läuft so weiter.\n→ BPMN 05", "q": "Workshop Teil 3, ca. 13:00–20:40", "f": "AP plus", "o": "Christian Sill: klären, ob der Job auch Änderungen (verschobene Geräte) aktualisiert.", "ts": ""}, "MM 3": {"t": "Wartungsverträge", "ts": "", "s": "Ziel: Der Servicelevel und der Partner stehen weiterhin am Kunden in MyMOBS. Quelle dafür ist künftig der Wartungsvertrag in Salesforce, nicht mehr AP plus.\n\n1. Der Wartungsvertrag wird in Salesforce angelegt, aktiviert oder geändert (Salesforce Nr. 20).\n2. Die Integration schreibt Servicelevel und Partner an den Kunden in MyMOBS.\n3. Der Vertrag selbst bleibt nur in Salesforce; in MyMOBS wird er nicht angezeigt.\n\nDer Abgleich der Verträge mit AP plus entfällt.", "q": "", "f": "Salesforce (Wartungsvertrag)", "o": "Wondercode: Feldzuordnung Salesforce-Wartungsvertrag → MyMOBS-Kunde festlegen.\nFehlende Daten: Den Partner gibt es am Wartungsvertrag in Salesforce heute nicht (er kommt aus AP plus). Ohne ihn kann der Partner nicht nach MyMOBS geschrieben werden."}, "MM 4": {"t": "Portal-Benutzer", "s": "Siehe Salesforce Nr. 7. Richtung Salesforce → MyMOBS (im Workshop korrigiert).\nJulian trägt den Kontakt im Account-Feld 'MyMOBS Admin' ein, die Integration legt den Admin in MyMOBS an und verschickt die Zugangsdaten über Brevo. Weitere Benutzer legt der Kunden-Admin selbst an. Bleibt so bis MyMOBS V2.\n→ BPMN 02", "q": "Workshop Teil 3, ca. 09:30–13:00 und 20:40–24:15; Teil 1, ca. 22:30 und 45:00", "f": "MyMOBS (Benutzer); Salesforce nur Auslöser", "o": "", "ts": ""}, "MM 5": {"t": "Notfallkontakte", "s": "Ziel: Fällt MyMOBS aus, kann C.M. Heim trotzdem alle Kunden-Admins informieren.\n\n1. Die Integration liest regelmässig alle Admin-Benutzer (Name, E-Mail) aus MyMOBS.\n2. Sie schreibt sie als Excel auf das Fileshare im Intranet und überschreibt die Datei jedes Mal vollständig.\n\nReine Sicherung, keine Verwaltung, kein Rückfluss. Bleibt so.\n→ BPMN 02", "q": "Workshop Teil 3, ca. 24:25–28:20", "f": "MyMOBS", "o": "", "ts": ""}, "MM 6": {"t": "Supportticket 24/7", "s": "Wenn das Callcenter (Supportanfrage 1, mit Betreiberkennwort) oder der Kunde (Supportanfrage 2) in MyMOBS eine Supportanfrage ausfüllt, dann ist ein Kundenvorgang in Salesforce angelegt.\nBleibt wie heute (Web2Case), kein Handlungsbedarf für den THOR-Nachfolger.\n→ BPMN 10\nRuft der Kunde an, legt der Technische Support den Kundenvorgang von Hand an (siehe Salesforce Nr. 12).", "q": "Workshop Teil 3, ca. 28:24–32:47; Confluence (Callcenter-Supportanfrage)", "f": "Salesforce (Kundenvorgang)", "o": "", "ts": ""}, "MM 7": {"t": "Tauschgerät anfragen", "s": "Nicht im Umfang: In MyMOBS können im Rahmen dieses Projekts keine Funktionen weiterentwickelt werden. Eine Anfrage für ein Tauschgerät direkt in MyMOBS ist deshalb nicht möglich.\n\nDer Kunde meldet einen Defekt wie heute per Telefon oder über die bestehende Supportanfrage in MyMOBS (Nr. 6); daraus entsteht ein Kundenvorgang in Salesforce. Der Tauschprozess selbst ist Salesforce Nr. 12.", "q": "", "f": "Salesforce (Kundenvorgang)", "o": "", "ts": "Tauschgerät in MyMOBS anfragen (nicht möglich)"}, "MM 8": {"t": "Portal-Benutzer ins Data Warehouse", "s": "Wenn Benutzer in MyMOBS angelegt oder geändert werden, dann sind alle Benutzer je Kunde im Data Warehouse sichtbar.\nHeute gibt es in Salesforce keine Übersicht, welche Admins angelegt wurden.\n→ BPMN 02", "q": "Workshop Teil 1, ca. 21:32 und 47:43", "f": "MyMOBS", "o": "C.M. Heim: bestätigen.", "ts": ""}, "MM 9": {"t": "Offboarding Portal", "s": "Nicht im Umfang (Entscheid 25.11.2026).\n\nHeute: Wird der Kontakt im Feld 'MyMOBS Admin' ersetzt, bleibt der alte Admin aktiv. Ein Offboarding von Benutzern gibt es nicht.\n→ BPMN 02", "q": "Workshop Teil 1, ca. 44:06–45:58; Teil 2, ca. 04:56–05:12", "f": "MyMOBS", "o": "", "ts": ""}, "Mon 2": {"t": "Aus SFC Auftrag in Monday auf Board zuweisen", "s": "Ziel: Partneraufträge gehen per Knopfdruck aus Salesforce auf das richtige Monday-Board, statt von Hand kopiert zu werden.\n\n1. Ein Partnerauftrag (alle Auftragsarten ausser Kauf/Miete, z. B. Montage, Inbetriebnahme, Schulung, Demontage, Service) ist in Salesforce angelegt.\n2. Am Auftrag wird per Button der Partner gewählt (der Partner ist in Salesforce heute nicht hinterlegt).\n3. Die Aufgabe wird im Board des Partners in der Gruppe der Auftragsart angelegt. Der Auftrag ist damit disponiert.\n4. Am Auftrag in Salesforce ist die Monday-Aufgabe verlinkt.\n5. In Monday darf der Partner alles ändern ausser der Auftragsnummer (Schlüssel).\n\nMonday bleibt, solange es funktioniert; Salesforce Field Service ist zu teuer und zu komplex. Monday selbst löst keine anderen Systeme aus.\n→ BPMN 06\nRolle laut Confluence: Das Order Management stellt die Aufgabe auf das Partner-Board.", "q": "Workshop Teil 3, ca. 01:09:46–01:13:00, 01:34:50–01:41:07, 01:47:00 und 02:00:46–02:03:00; Teil 2, ca. 06:58–08:01", "f": "Salesforce (Auftrag); Monday (Ausführung)", "o": "C.M. Heim: Testboards und Admin-Token bereitstellen.\nC.M. Heim: Aufträge künftig anpassen statt löschen und neu anlegen. Sonst brechen die Verknüpfungen zu Monday, Bestellung und Data Warehouse.\nWondercode: prüfen, ob Monday eine eindeutige ID liefert und ob es eine fertige Monday-Integration für Salesforce gibt.\nWiderspruch zu Salesforce Nr. 15: Dort geht die Aufgabe mit der Freigabe automatisch an Monday, hier per Button. Welche Variante gilt?\nWondercode + C.M. Heim: Die Funktionalität (Partnerwahl per Button, Aufgabe im richtigen Board) muss in Salesforce entwickelt werden. Dafür braucht es ein Mapping: Partner → Monday-Board und Auftragsart → Gruppe im Board. Wer liefert das Mapping, und wo wird es gepflegt?", "ts": ""}, "Mon 3": {"t": "Aus SFC Wartungsvertrag in Monday auf Board zuweisen", "s": "Ziel: Die Wartungsaufgaben je Quartal entstehen per Knopfdruck aus Salesforce, statt rund 4 Stunden pro Quartal von Hand kopiert zu werden.\n\n1. Im Wartungsvertrag (IHV) steht der nächste Service (Quartal, Inspektion oder Wartung, je nach Servicelevel).\n2. Per Button 'Aufgabe an Monday' am Wartungsvertrag werden Art (Inspektion/Wartung), Quartal und Partner abgefragt.\n3. Die Aufgabe (Projektname, WV-Nummer, Art, Quartal) wird im Board des Partners angelegt und am Wartungsvertrag verlinkt.\n4. Den konkreten Termin vereinbart ihr in Monday mit dem Partner; er hat das ganze Quartal Zeit.\n\nSpäter denkbar: alle fälligen Wartungen eines Quartals auf einmal anlegen.\n→ BPMN 08\nRolle laut Confluence: Der Innendienst stellt die Wartungen auf das Board und stimmt den Termin mit Kunde und Partner ab.", "q": "Workshop Teil 3, ca. 01:11:12 und 01:23:37–01:28:36", "f": "Salesforce (Wartungsvertrag)", "o": "C.M. Heim: Sollen alle fälligen Verträge eines Quartals auf einmal angelegt werden?\nWondercode: Der Button „Aufgabe an Monday“ am Wartungsvertrag (Abfrage Art, Quartal, Partner) muss in Salesforce noch entwickelt werden.", "ts": ""}, "Mon 4": {"t": "Aus monday.com Bestellung in AP+ auslösen", "s": "Ziel: Jede Beauftragung eines Servicepartners läuft als Bestellung über AP plus (Vorgabe, rund 20 pro Woche), ausgelöst aus Salesforce statt per Nachricht in Monday.\n\n1. Ein Serviceauftrag (Montage, Inbetriebnahme, Demontage, Entstörung, Wartung, Hubarbeitsbühne) ist in Salesforce angelegt.\n2. Am Auftrag wird per Button 'Bestellvorschlag an Partner' der Partner gewählt.\n3. In AP plus entsteht im Einkauf ein Bestellvorschlag mit den Positionen Arbeitszeit Servicetechniker (Stunden) und Anfahrt (km).\n4. Der Einkauf löst die Bestellung aus und schickt sie an den Partner (heute Alexandra, ab Januar 2027 der Einkauf).\n5. Die Prüfung der Partnerrechnung gegen Bestellung und Arbeitsbericht bleibt manuell.\n\nNicht aus Monday ausgelöst: Monday soll keine anderen Systeme auslösen.\n→ BPMN 06, 08", "q": "Workshop Teil 3, ca. 01:11:12, 01:13:28–01:17:44 und 01:42:36–02:00:37", "f": "Salesforce (Auslösung); AP plus (Bestellung)", "o": "C.M. Heim: Je Serviceauftrag eine Bestellung? Heute fasst Heike teils mehrere Aufträge zu einer Bestellung zusammen.\nC.M. Heim: Partner als Lieferant in AP plus bestätigen.\nPartnerangebot: Laut Confluence holt das Order Management erst ein Angebot beim Partner ein, dann bestellt der Einkauf. Hier geht es direkt zum Bestellvorschlag. Bleibt das Partnerangebot?\nC.M. Heim: Ist der Account-Typ Partner/Hybrid die Definition eines Servicepartners, und gibt es jeden Partner als Lieferant in AP plus?", "ts": "Bestellung beim Partner aus Salesforce auslösen"}, "Mon 5": {"t": "Status aus Monday", "s": "Frage im Workshop: Was kommt von Monday zurück nach Salesforce? Mindestens der Status; heute stimmen die Status in Monday und Salesforce nicht überein.\nÜber die Auftrags- bzw. WV-Nummer als Schlüssel könnte der Status zurückgespielt werden. Monday stösst dabei keine weiteren Abläufe an.\nNicht entschieden.\n→ BPMN 06", "q": "Workshop Teil 3, ca. 01:37:13–01:38:46", "f": "Monday (Ausführung)", "o": "C.M. Heim: Soll der Status aus Monday nach Salesforce kommen?\nWondercode: prüfen, ob Monday eine eindeutige ID liefert.", "ts": ""}, "Mon 6": {"t": "Monday-Daten ins Data Warehouse", "s": "Im Workshop als Frage gestellt: Braucht es Monday-Daten (z. B. Termine, Status) im Data Warehouse? Nicht beantwortet.", "q": "Workshop Teil 3, ca. 01:09:46", "f": "Monday", "o": "C.M. Heim: Wird das gebraucht?", "ts": ""}, "Red 1": {"t": "Eskalierte KV in Redmine anlegen", "s": "Wunsch: Eskalierte Kundenvorgänge aus Salesforce als Ticket in Redmine anlegen (heute von Hand). Tickets per E-Mail wären möglich, ohne Rückmeldung bringt das aber wenig.\nErgebnis: kein direktes Data-Warehouse-Thema, zurückgestellt; C.M. Heim stimmt intern ab.\n→ BPMN 10", "q": "Workshop Teil 3, ca. 35:02–35:23 und 02:03:00–02:04:36", "f": "Salesforce (Kundenvorgang)", "o": "C.M. Heim: intern klären, ob und wie die Anbindung gewünscht ist.", "ts": ""}, "SF 20": {"t": "Wartungsvertrag anlegen und aktivieren", "ts": "", "s": "Ziel: Wartungsverträge (IHV) werden nur in Salesforce angelegt und gepflegt. Sie lösen MyMOBS Nr. 3 (Servicelevel und Partner), Monday Nr. 3 (Quartalsaufgabe) und Nr. 10 (Wartungsmaterial) aus.\n\n1. Der Technische Support bestätigt den IHV-Auftrag und legt den Wartungsauftrag an (Servicelevel, Intervall, nächster Service).\n2. Ist der IHV-Auftrag geliefert, setzt der Innendienst ihn auf 'geliefert' und aktiviert den Vertrag.\n3. Am Wartungsvertrag werden die Anlagen zugeordnet, die gewartet werden (Nr. 16).\n\nDiese Schritte laufen in Salesforce wie heute. Der Abgleich mit AP plus entfällt (Nr. 6).", "q": "Confluence 5.8 (IHV Auftrag); bisher beschrieben in Nr. 6 und MyMOBS Nr. 3", "f": "Salesforce (Wartungsvertrag)", "o": "C.M. Heim: Was prüft der TS beim Bestätigen ('Was prüfen??' in Confluence)?\nC.M. Heim: SL5-Bereitschaft (Betreiberkennwort, Verbindungsmerkblatt an den Partner, MyMOBS-Zugänge durch den TS) ist nicht abgebildet. Bleibt das manuell?\nC.M. Heim: Kann eine Anlage über die Zeit zu verschiedenen Wartungsverträgen gehören? Dann braucht es eine Zuordnung mit Gültigkeitsdaten."}};

 B16:["H","Verträge entstehen aus der Opportunity, nie aus dem Auftrag","Alle 2'581 Verträge entstehen aus der Opportunity. Bei allen 6'208 Aufträgen ist das Vertragsfeld leer, keine der 11'629 Subscriptions zeigt auf eine Auftragsposition. 39 Opportunities haben mehrere Verträge.","Vom Auftrag führt kein Weg zum Vertrag. Nach der Mietzeit entsteht jeden Monat ein neuer Vertrag.","Die erste Opportunity wird zum Mietschlüssel: neues Feld Original_Opportunity__c auf jeder Verlängerungs-Opportunity, gesetzt vom bestehenden Flow. 918 von 989 Mieten lassen sich automatisch nachtragen."],
 B2:["H","Asset ist eine Kopie der Angebotsposition, kein Anlagenbestand","CPQ erzeugt beim „Contracted“ ein Asset je Angebotsposition, ohne Seriennummer, Status oder Standort. Nur 13 alte Assets zeigen auf eine Anlage.","Was gerade beim Kunden steht, lässt sich aus Asset nicht beantworten.","Anlage__c und GeraetedatenbankAP__c als Anlagenbestand nutzen und entscheiden, ob Asset dafür überhaupt verwendet wird."],
 B3:["H","Die Integration wird von Hand über Schnellaktionen ausgelöst","Vier Screen-Flows hinter Schnellaktionen erzeugen die Auslöse-Aufgaben (Account, Auftrag, Opportunity, Case). Nichts prüft auf eine frühere Anfrage.","Die Soll-Auslöser sind Geschäftsereignisse: „Closed Won“, Freigabe, Rückgabe gewählt. Heute hängt die Übergabe an einem Klick.","Auslöser über den Status von Opportunity und Auftrag, ein Schlüssel gegen doppelte Anfragen und das Ergebnis sichtbar am Datensatz."],
 B4:["H","Rücksendungen haben keine Zeilen und keine Verknüpfung","Returns__c (622) ist nur ein Kopf mit Status 2 → 3 → 4, ohne Zeilen und ohne Verknüpfung zu Vertrag, Auftrag, Anlage oder Gerät. 449 hängen an keiner Miete, 177 stehen seit über 60 Tagen auf Status 2.","Soll/Ist je Anlage, Ausbuchen und die nächste Verlängerung mit Restmenge lassen sich heute nicht speichern.","Neues Objekt Rücksendezeile (erwartet je Anlage, gebuchte Seriennummern aus AP plus), Verknüpfung zu Miete und Anlage, Feldverlauf auf dem Status."],
 B5:["M","Vertragsdaten stecken im Freitext Notiz__c","Contract.Notiz__c (80 Zeichen) ist bei rund 42 % gefüllt: Wareneingangsnummern, Rückgaben, Verlängerungen, Rabatte, Kündigungsdaten.","Die einzige Verbindung zwischen Vertrag und Rückgabe ist heute eine Nummer im Freitext.","Strukturierte Felder (Rückgabe-Referenz, Kündigungsdatum, Nachfolger) und Übernahme der bestehenden Notizen."],
 B6:["M","Doppelte und nicht eindeutige Produkte","Mietartikel sind eigene „M-“-Produkte (119). 20 Produktcodes kommen zwei- oder dreimal vor. Das Feld ToBeChecked__c existiert, wird aber nie gesetzt.","Ein doppelter Code kann den falschen Artikel nach AP plus schicken oder ein Gerät falsch zuordnen.","Doppelte Codes bereinigen, Eindeutigkeit erzwingen und neue Artikel aus AP plus mit „To be checked“ übernehmen."],
 B7:["M","Anlagen und Geräte sind eine veraltete Anzeigekopie","THOR legt nur an und ändert. Ausbuchungen und Löschungen kommen nie an, nichts vor dem 13.06.2020. Anlage__c hat keinen Feldverlauf, wird aber von Hand geändert.","Rückgaben und Soll/Ist würden mit Anlagen arbeiten, die es nicht mehr gibt.","Vollständiger Abgleich inkl. Ausbuchungen, Feldverlauf auf Anlage__c, ein Verantwortlicher je Feld, drei ungenutzte Felder entfernen."],
 B17:["M","Gerätedaten sind für Benutzer unsichtbar","Die 13 wichtigsten Felder auf GeraetedatenbankAP__c (Seriennummer, AP-ID, Anlage …) sieht nicht einmal ein Admin, nur der THOR-Benutzer.","Der Service kann im Case oder bei der Rücksendung kein Gerät über die AP-ID wählen, wie es der Soll-Ablauf verlangt.","Leserecht für Service und Vertrieb, Gerät auf Anlage, Case und Rücksendung anzeigen."],
 B8:["M","Der Servicepartner steht nicht am Auftrag","Der Auftrag hat kein Feld für Partner oder Monday. Partner sind nur über den Account-Typ (Partner, Hybrid) erkennbar.","Monday-Aufgaben und Bestellvorschläge in AP plus brauchen den Partner, und er muss einem Lieferanten in AP plus entsprechen.","Partner-Feld am Auftrag, klare Partner-Definition am Account, Lieferantennummer aus AP plus am Partner."],
 B9:["M","Kein Lieferstatus aus AP plus","„geliefert“ setzt das Order Management von Hand, dafür ist ein Leistungsdatum Pflicht. Die Rückmeldung von THOR ist abgeschaltet.","Die Rechnung in JustOn hängt an „geliefert“.","Status und Leistungsdatum aus dem Warenausgang in AP plus setzen. Entscheid, ob das die Rechnung automatisch auslöst."],
 B10:["H","Welche Anlage zu welchem Wartungsvertrag gehört, ist nicht abgebildet","Eine Anlage kann nur auf einen Wartungsvertrag zeigen, ohne Verlauf. 132 von 336 Wartungsverträgen haben keine Anlage, 38 Kunden haben sich überschneidende Verträge.","Quartalsaufgaben und Wartungsmaterial (Melder × 2) brauchen eine verlässliche Liste der Anlagen je Vertrag.","Zuordnungsobjekt Anlage ↔ Wartungsvertrag mit Gültigkeitsdaten und einmalige Bereinigung der 132 Verträge."],
 B11:["M","Kundenidentität und Filialen","Firmen in AP plus werden über Name, Ort und Strasse gefunden. Nur 203 von 6'372 Accounts nutzen eine Mutterfirma, Filialen sehen wie Dubletten aus.","Mit „Closed Won“ als automatischem Auslöser würde ein falscher Treffer den falschen Kunden anlegen oder verwenden.","Account-Hierarchie, eigene Dublettenregel, Abgleich zuerst über die Kundennummer."],
 B12:["L","Alte und ungenutzte Objekte","Order__c und Quote__c sind seit April 2024 ausser Betrieb, werden aber noch referenziert. Field Service ist nicht live, Reste (21 Flows, Lizenzen) existieren.","Wenig direkte Wirkung, aber Historie für das Data Warehouse liegt auf Order__c.","Order__c nur noch lesend behalten, Field-Service-Reste und Test-Schnellaktion entfernen."],
 B13:["M","AP-Auftragsnummern nicht eindeutig","Drei AP-Auftragsnummern stehen auf je zwei Aufträgen.","AP-Nummer, Monday-Aufgabe, Bestellung und Data Warehouse hängen am Auftrag. Doppelte oder neu angelegte Aufträge brechen diese Verbindungen.","AP_Auftrags_ID__c eindeutig machen, Dublettenprüfung vor der Übergabe, Regel „Aufträge ändern, nie neu anlegen“."],
 B14:["M","Lieferadresse ist unstrukturiert","Der Auftrag hat eine Lieferadresse. Mehrzeilige Strassen werden nicht bereinigt, PLZ und Land beim Abgleich ignoriert.","Das Soll verlangt eine korrekte Lieferadresse bei jedem Auftrag und bei der Kundenanlage.","Pflicht-Lieferadresse, strukturiert an Account und Auftrag, Abgleich mit PLZ und Land."],
 B15:["M","Betreiberkennwort im CRM, Integrationsbenutzer mit zu vielen Rechten","Account.Operator_password__c steht im Klartext (bei rund 89 % gefüllt). Der THOR-Benutzer hat CPQ-Admin und „View All Users“. Wird „MyMOBS Admin“ ersetzt, bleibt der alte Admin aktiv.","Ein Zugangsdatum in einem durchsuchbaren Feld und ein zu mächtiger Integrationsbenutzer sind Sicherheitsrisiken, die die neue Integration nicht übernehmen darf.","Feld entfernen oder verschlüsseln, eigener Integrationsbenutzer mit minimalen Rechten, Entscheid zum Offboarding."]
